extends: existence
message: "Use the singular or plural form, both forms joined by 'or', or 'one or more' instead of '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/style/plurals/'
level: warning
nonword: true
# The lookahead skips camelCase command names, such as dropIndex(es).
tokens:
  - '\b(?![a-z]+[A-Z])[A-Za-z]+\((?:s|es)\)'
