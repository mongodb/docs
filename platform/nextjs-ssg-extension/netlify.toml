

[dev]
command = "netlify-extension dev"
publish = ".ntli/site/static"
port = 8989

[functions]
directory = "src/endpoints"

[[plugins]]
package = "@netlify/netlify-plugin-netlify-extension"

[build.environment]
# Excludes docs-site, the only package with private @mdb deps, so no
# CodeArtifact token is needed. snooty-ast-to-mdx is imported by relative
# path, so include it explicitly.
PNPM_FLAGS = "--filter ssg-extension... --filter snooty-ast-to-mdx"

[build]
command = '''
set -euo pipefail
if [ -d platform ]; then cd platform; fi
pnpm --filter ssg-extension run ssg-extension:build
'''