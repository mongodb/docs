extends: existence
message: "Don't mix 'between' or 'from' with a dash in '%s'. Use 'between X and Y' or 'from X through Y'."
link: 'https://www.mongodb.com/docs/meta/style-guide/style/numbers/#ranges-of-numbers'
level: warning
ignorecase: true
nonword: true
# The lookahead skips dates such as "from 2024-01-15".
tokens:
  - '\b(?:between|from)\s+\d+\s*[–-]\s*\d+\b(?!-)'
