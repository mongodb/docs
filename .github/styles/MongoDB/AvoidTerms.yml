extends: existence
message: "Don't use '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/terminology/alphabetical-terms/'
ignorecase: true
level: error
tokens:
  - abortion
  - and/or
  - 'slash\s+mark'
  - billion
  - biweekly
  - bimonthly
  - 'if\s+necessary'
  - respectively
  - trillion
