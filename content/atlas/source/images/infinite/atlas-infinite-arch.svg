<svg xmlns="http://www.w3.org/2000/svg" width="720" height="694" viewBox="0 0 720 694" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Where Atlas Infinite fits: application, compute, storage and management (MongoDB colors)</title>
<desc>A single Atlas architecture diagram in MongoDB green palette on a white background, enclosed in an outer box labeled Atlas, for showing where the Atlas database fits. Four green pill labels: Application, Compute, Storage and Management. The Application column lists end-user apps, Compass and shell, SQL support, data science and drivers. The Compute column shows a single enlarged, vertically centered Cluster box. The Storage column is a single opaque managed box described only by customer guarantees, stacked as Secure, Durable, Highly available and Continuously backed up, and managed by Atlas. Below the three columns, a full-width Management band is split into two labeled groups: Interfaces (Atlas UI, Atlas API, Admin tools CLI and SDK) and Operations (Provision clusters, Monitor and back up).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3D4F58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="720" height="694" fill="#FFFFFF"/>

<!-- Atlas wrapper -->
<rect x="20" y="64" width="680" height="604" rx="18" fill="#FFFFFF" stroke="#00684A" stroke-width="1.5"/>
<rect x="270" y="16" width="180" height="40" rx="20" fill="#00ED64"/>
<text x="360" y="37" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#001E2B">Atlas Infinite</text>

<g transform="translate(0,-28)">
<!-- Columns -->
<rect x="52" y="150" width="224" height="340" rx="12" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1"/>
<rect x="300" y="150" width="176" height="340" rx="12" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1"/>
<rect x="500" y="150" width="168" height="340" rx="12" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1"/>

<!-- Layer pills (all same green) -->
<rect x="99" y="136" width="130" height="26" rx="13" fill="#00ED64"/><text x="164" y="149" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Application</text>
<rect x="346" y="136" width="84" height="26" rx="13" fill="#00ED64"/><text x="388" y="149" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Compute</text>
<rect x="542" y="136" width="84" height="26" rx="13" fill="#00ED64"/><text x="584" y="149" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Storage</text>

<!-- data-flow arrows aligned with centered compute box (two one-way arrows each) -->
<line x1="278" y1="313" x2="310" y2="313" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="310" y1="327" x2="278" y2="327" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="466" y1="313" x2="498" y2="313" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="498" y1="327" x2="466" y2="327" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Application column boxes (Administration tools moved out; Analytics/OLTP subtitle removed) -->
<rect x="60" y="174" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/><text x="164" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">End-user apps</text>
<rect x="60" y="234" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/><text x="164" y="253" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">Compass / shell</text><text x="164" y="271" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5C6C75">Data exploration</text>
<rect x="60" y="294" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/><text x="164" y="313" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">SQL support</text><text x="164" y="331" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5C6C75">BI &#183; reporting</text>
<rect x="60" y="354" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/><text x="164" y="373" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">Data science</text><text x="164" y="391" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5C6C75">Stats &#183; ML</text>
<rect x="60" y="414" width="208" height="52" rx="8" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/><text x="164" y="433" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">Drivers</text><text x="164" y="451" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5C6C75">JS &#183; Python &#183; Java &#183; Go</text>

<!-- Compute: single enlarged, vertically-centered Cluster box -->
<rect x="324" y="258" width="140" height="100" rx="10" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/>
<rect x="312" y="270" width="152" height="100" rx="10" fill="#FFFFFF" stroke="#C1C7C6" stroke-width="1"/>
<text x="388" y="320" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#023430">Cluster</text>

<!-- Storage: opaque managed box, Secure-first, managed by Atlas -->
<rect x="512" y="176" width="144" height="288" rx="10" fill="#00684A" stroke="#00A35C" stroke-width="1"/><rect x="528" y="194" width="112" height="46" rx="8" fill="#023430" stroke="#00A35C" stroke-width="1"/><text x="584" y="217" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">Secure</text><rect x="528" y="248" width="112" height="46" rx="8" fill="#023430" stroke="#00A35C" stroke-width="1"/><text x="584" y="271" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">Durable</text>
<rect x="528" y="302" width="112" height="46" rx="8" fill="#023430" stroke="#00A35C" stroke-width="1"/><text x="584" y="325" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">Highly available</text>
<rect x="528" y="356" width="112" height="52" rx="8" fill="#023430" stroke="#00A35C" stroke-width="1"/><text x="584" y="374" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">Continuously</text><text x="584" y="390" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">backed up</text>
<text x="584" y="438" text-anchor="middle" dominant-baseline="central" font-size="10" font-style="italic" fill="#C0FAE6">managed by Atlas</text>
</g>

<!-- Management band: Interfaces vs Operations -->
<rect x="52" y="508" width="616" height="132" rx="12" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1"/>
<rect x="295" y="494" width="130" height="26" rx="13" fill="#00ED64"/><text x="360" y="507" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Management</text>

<rect x="68" y="526" width="352" height="98" rx="10" fill="#FFFFFF" stroke="#E0E5E4" stroke-width="1"/>
<text x="244" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3D4F58">Interfaces</text>
<rect x="76" y="554" width="78" height="56" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="115" y="582" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#023430">Atlas UI</text>
<rect x="162" y="554" width="78" height="56" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="201" y="582" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#023430">Atlas API</text>
<rect x="248" y="554" width="78" height="56" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="287" y="582" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#023430">CLI &#183; SDK</text>
<rect x="334" y="554" width="78" height="56" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="373" y="582" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#023430">IaC</text>

<rect x="436" y="526" width="216" height="98" rx="10" fill="#FFFFFF" stroke="#E0E5E4" stroke-width="1"/>
<text x="544" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3D4F58">Operations</text>
<rect x="444" y="554" width="96" height="56" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="492" y="575" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#023430">Manage</text><text x="492" y="591" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#023430">clusters</text>
<rect x="548" y="554" width="96" height="56" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="596" y="575" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#023430">Monitor &amp;</text><text x="596" y="591" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#023430">back up</text>
<!-- Management to Compute and Storage (two one-way arrows each) -->
<line x1="434" y1="508" x2="434" y2="342" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="446" y1="342" x2="446" y2="508" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="578" y1="508" x2="578" y2="436" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590" y1="436" x2="590" y2="508" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
