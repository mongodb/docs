<svg width="560px" height="620px" viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker></defs>

  <!-- Kubernetes Cluster outer container -->
  <rect x="30" y="20" width="500" height="580" rx="16" fill="none" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="50" y="10" width="190" height="24" rx="6" fill="#00684A"/>
  <text x="145" y="22" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Kubernetes Cluster</text>

  <!-- Operator-Managed Sharded Cluster container -->
  <rect x="55" y="44" width="450" height="160" rx="12" fill="#E3F5ED" stroke="#00684A" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="280" y="66" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#00684A">Operator-Managed MongoDB Sharded Cluster</text>

  <!-- shard-0 (center 185) -->
  <rect x="120" y="88" width="130" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="185" y="107" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">shard-0</text>
  <text x="185" y="126" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">ReplicaSet</text>

  <!-- shard-1 (center 355) -->
  <rect x="290" y="88" width="130" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="355" y="107" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">shard-1</text>
  <text x="355" y="126" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">ReplicaSet</text>

  <!-- mongod managed label -->
  <text x="280" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">(mongod instances managed by the operator)</text>

  <!-- Arrows from shards straight down to the proxy Service -->
  <line x1="185" y1="144" x2="185" y2="227" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="355" y1="144" x2="355" y2="227" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Per-shard K8s Service (proxy-svc) box, shard-0 (center 185) -->
  <rect x="105" y="228" width="160" height="52" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="185" y="247" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#001E2B">K8s Service (ClusterIP)</text>
  <text x="185" y="265" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#3D4F58">shard-0 proxy-svc</text>

  <!-- Per-shard K8s Service (proxy-svc) box, shard-1 (center 355) -->
  <rect x="275" y="228" width="160" height="52" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="355" y="247" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#001E2B">K8s Service (ClusterIP)</text>
  <text x="355" y="265" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#3D4F58">shard-1 proxy-svc</text>

  <!-- Arrows Service -> Envoy (per shard) -->
  <line x1="185" y1="280" x2="185" y2="303" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="355" y1="280" x2="355" y2="303" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Envoy Proxy box -->
  <rect x="80" y="304" width="380" height="120" rx="10" fill="#001E2B" stroke="#00ED64" stroke-width="1.5"/>
  <text x="270" y="328" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00ED64">Envoy Proxy</text>
  <text x="270" y="345" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9BCFC3">(operator-managed)</text>
  <circle cx="108" cy="366" r="3" fill="#00ED64"/>
  <text x="120" y="370" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">Listens on port 27028</text>
  <circle cx="108" cy="386" r="3" fill="#00ED64"/>
  <text x="120" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">TLS (SNI-based routing) to the matching shard</text>
  <circle cx="108" cy="406" r="3" fill="#00ED64"/>
  <text x="120" y="410" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">mTLS to mongot backends</text>

  <!-- Arrows from Envoy down to mongot StatefulSets -->
  <line x1="185" y1="424" x2="185" y2="492" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="355" y1="424" x2="355" y2="492" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mongot-shard-0 StatefulSet -->
  <rect x="102" y="493" width="166" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="185" y="516" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-search-shard-0</text>
  <text x="185" y="536" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">mongot StatefulSet</text>

  <!-- mongot-shard-1 StatefulSet -->
  <rect x="272" y="493" width="166" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="355" y="516" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-search-shard-1</text>
  <text x="355" y="536" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">mongot StatefulSet</text>

  <!-- one mongot StatefulSet per shard note -->
  <text x="280" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">One mongot StatefulSet per shard.</text>

  <!-- MongoDB leaf logo mark -->
  <g transform="translate(488, 32)">
    <path d="M10 0 C10 0, 18 8, 18 16 C18 24, 10 28, 10 28 C10 28, 2 24, 2 16 C2 8, 10 0, 10 0Z" fill="#00ED64"/>
    <line x1="10" y1="14" x2="10" y2="30" stroke="#00684A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
