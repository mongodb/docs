<svg xmlns="http://www.w3.org/2000/svg" width="900" height="524" viewBox="0 0 900 524" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Atlas Core versus Atlas Infinite</title>
<desc>Two side-by-side Atlas panels in MongoDB colors on a white background, comparing the database itself: compute and storage only, with no application layer and no management layer. Left panel: Atlas Core. A client feeds a primary and two secondary mongod nodes; each node is a solid-outlined unit that owns its own local storage, with a down arrow from the mongod to its storage and an up arrow from the storage back to the mongod; dashed arrows show logical replication from the primary to each secondary. Right panel: Atlas Infinite. A client feeds a compute layer (dashed grouping) of a primary, a standby and an optional read-replica mongod that connects to a single opaque Storage layer box; a caption notes that replication is handled within the storage layer. The storage layer is labeled Secure, Durable, Highly Available and managed by Atlas. A legend at the bottom explains the line and outline styles.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3D4F58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#889397" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="900" height="524" fill="#FFFFFF"/>
<!-- ===================== LEFT PANEL: CORE ===================== -->
<rect x="24" y="44" width="428" height="404" rx="14" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1.5"/>
<rect x="40" y="58" width="110" height="26" rx="13" fill="#00ED64"/><text x="95" y="71" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#001E2B">Atlas Core</text>
<rect x="148" y="116" width="180" height="34" rx="17" fill="#00ED64"/><text x="238" y="133" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Client apps + drivers</text>
<line x1="238" y1="150" x2="238" y2="172" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="176" width="396" height="222" rx="10" fill="#F3F7F6" stroke="#E0E5E4" stroke-width="1"/>
<text x="238" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3D4F58">compute + storage</text>
<!-- (replica-set grouping removed per feedback) -->
<!-- logical replication dashed arrows (label placed clear of curves) -->
<text x="238" y="224" text-anchor="middle" dominant-baseline="central" font-size="10" font-style="italic" fill="#5C6C75">logical replication</text>
<path d="M132 252 Q186 238 240 252" fill="none" stroke="#889397" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
<path d="M126 250 Q238 236 350 250" fill="none" stroke="#889397" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
<!-- node units: each solid box = mongod + its own local storage, with read/write arrows -->
<g>
<rect x="58" y="262" width="116" height="120" rx="8" fill="#FFFFFF" stroke="#00684A" stroke-width="1.3"/>
<rect x="66" y="270" width="100" height="42" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="116" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#023430">Primary</text><text x="116" y="300" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#00684A">mongod</text>
<line x1="104" y1="312" x2="104" y2="332" stroke="#3D4F58" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="128" y1="332" x2="128" y2="312" stroke="#3D4F58" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="66" y="332" width="100" height="42" rx="6" fill="#00684A" stroke="#00A35C" stroke-width="1"/><text x="116" y="353" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">Local storage</text>
</g>
<g>
<rect x="180" y="262" width="116" height="120" rx="8" fill="#FFFFFF" stroke="#00684A" stroke-width="1.3"/>
<rect x="188" y="270" width="100" height="42" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="238" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#023430">Secondary</text><text x="238" y="300" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#00684A">mongod</text>
<line x1="226" y1="312" x2="226" y2="332" stroke="#3D4F58" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="250" y1="332" x2="250" y2="312" stroke="#3D4F58" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="188" y="332" width="100" height="42" rx="6" fill="#00684A" stroke="#00A35C" stroke-width="1"/><text x="238" y="353" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">Local storage</text>
</g>
<g>
<rect x="302" y="262" width="116" height="120" rx="8" fill="#FFFFFF" stroke="#00684A" stroke-width="1.3"/>
<rect x="310" y="270" width="100" height="42" rx="6" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="360" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#023430">Secondary</text><text x="360" y="300" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#00684A">mongod</text>
<line x1="348" y1="312" x2="348" y2="332" stroke="#3D4F58" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="372" y1="332" x2="372" y2="312" stroke="#3D4F58" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="310" y="332" width="100" height="42" rx="6" fill="#00684A" stroke="#00A35C" stroke-width="1"/><text x="360" y="353" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">Local storage</text>
</g>
<text x="238" y="418" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5C6C75">storage attached to each node</text>
<!-- ===================== RIGHT PANEL: INFINITE ===================== -->
<rect x="468" y="44" width="428" height="404" rx="14" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1.5"/>
<rect x="484" y="58" width="140" height="26" rx="13" fill="#00ED64"/><text x="554" y="71" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#001E2B">Atlas Infinite</text>
<rect x="592" y="116" width="180" height="34" rx="17" fill="#00ED64"/><text x="682" y="133" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Client apps + drivers</text>
<line x1="682" y1="150" x2="682" y2="172" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- compute layer dashed grouping -->
<rect x="484" y="176" width="396" height="96" rx="10" fill="none" stroke="#889397" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="498" y="190" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#3D4F58">Compute layer</text>
<rect x="494" y="204" width="118" height="54" rx="8" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="553" y="223" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#023430">Primary</text><text x="553" y="239" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#00684A">mongod</text>
<rect x="623" y="204" width="118" height="54" rx="8" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="682" y="223" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#023430">Standby</text><text x="682" y="239" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#00684A">mongod</text>
<rect x="752" y="204" width="118" height="54" rx="8" fill="#E3FCF7" stroke="#00684A" stroke-width="1.5" stroke-dasharray="2 3"/><text x="811" y="223" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#023430">Read replica</text><text x="811" y="239" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#00684A">(optional)</text>
<!-- connects to storage; replication note -->
<line x1="560" y1="272" x2="560" y2="314" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="804" y1="314" x2="804" y2="272" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="682" y="293" text-anchor="middle" dominant-baseline="central" font-size="10" font-style="italic" fill="#5C6C75">replication handled within the storage layer</text>
<!-- storage layer = single opaque box, wording matched to diagram 3 -->
<rect x="484" y="316" width="396" height="80" rx="10" fill="#00684A" stroke="#00A35C" stroke-width="1.5"/>
<text x="682" y="338" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#FFFFFF">Storage layer</text>
<text x="682" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" letter-spacing="0.5" fill="#71F6BA">Secure &#183; Durable &#183; Highly Available</text>
<text x="682" y="382" text-anchor="middle" dominant-baseline="central" font-size="10" font-style="italic" fill="#C0FAE6">managed by Atlas</text>
<text x="682" y="418" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5C6C75">compute connects to an Atlas-managed storage layer</text>
<!-- ===================== LEGEND ===================== -->
<rect x="24" y="464" width="872" height="44" rx="10" fill="#F9FBFA" stroke="#E0E5E4" stroke-width="1"/>
<line x1="44" y1="486" x2="78" y2="486" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="86" y="486" text-anchor="start" dominant-baseline="central" font-size="11" fill="#3D4F58">Data path</text>
<rect x="188" y="476" width="30" height="20" rx="4" fill="none" stroke="#889397" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="226" y="486" text-anchor="start" dominant-baseline="central" font-size="11" fill="#3D4F58">Logical grouping (compute layer)</text>
<rect x="500" y="476" width="30" height="20" rx="4" fill="#FFFFFF" stroke="#00684A" stroke-width="1.3"/>
<text x="538" y="486" text-anchor="start" dominant-baseline="central" font-size="11" fill="#3D4F58">Node + its own storage</text>
<line x1="720" y1="486" x2="754" y2="486" stroke="#889397" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
<text x="762" y="486" text-anchor="start" dominant-baseline="central" font-size="11" fill="#3D4F58">Logical replication</text>
</svg>
