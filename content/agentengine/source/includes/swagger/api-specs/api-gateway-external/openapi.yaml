    get:
      description: Retrieve gzipped JSONL log batches written by the agent runtime
        to S3 for a workspace in the caller's project.
      parameters:
      - description: Project ObjectID (must belong to caller's org)
        in: header
        name: X-Project-ID
        required: true
        schema:
          type: string
      - description: Workspace identifier
        in: query
        name: workspace_id
        required: true
        schema:
          type: string
      - description: 'RFC3339 start time (default: 1 hour ago)'
        in: query
        name: start_time
        schema:
          type: string
      - description: 'RFC3339 end time (default: now)'
        in: query
        name: end_time
        schema:
          type: string
      - description: Max entries (default 500, max 5000)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque pagination cursor from a previous response
        in: query
        name: cursor
        schema:
          type: string
      - description: 'Minimum log level: DEBUG, INFO, WARNING, ERROR'
        in: query
        name: level
        schema:
          type: string
      - description: Filter by execution ID (exact match)
        in: query
        name: execution_id
        schema:
          type: string
      - description: Filter by session ID (exact match)
        in: query
        name: session_id
        schema:
          type: string
      - description: 'Filter by source: stdout, stderr, python-logging'
        in: query
        name: source
        schema:
          type: string
      - description: 'Filter by service: agent-execution-runtime, orchestration-engine,
          tool-executor, memory-server'
        in: query
        name: service
        schema:
          type: string
      - description: Case-insensitive substring match on message field
        in: query
        name: search
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.AgentLogsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
