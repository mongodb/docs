extends: existence
message: "Avoid claiming support for third-party software ('%s') unless someone tracks how that software evolves. Tell readers how to verify support instead."
link: 'https://www.mongodb.com/docs/meta/style-guide/terminology/alphabetical-terms/'
level: suggestion
ignorecase: true
nonword: true
# The style guide targets claims that MongoDB supports third-party software.
# Statements about which features, options, or modes a MongoDB product
# supports are factual and not flagged.
tokens:
  - '\b(?:officially|fully)\s+supported\b'
  - '\bsupported\s+(?:by\s+MongoDB|platforms?|operating\s+systems?|browsers?|third-party)\b'
