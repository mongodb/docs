[build]
    publish = "dist"
    base = "content/kubernetes"

[build.environment]
    REPO_NAME ="docs-mck"
    SECRETS_SCAN_ENABLED = "false"
    OFFLINE_SNOOTY_ENABLED = "false"
    SEARCH_MANIFEST_ENABLED = "false"
    MUT_COMMANDS_ENABLED = "false"
    REDOC_ENABLED = "false"

[context.production.environment]
    ENV = "dotcomprd"
 
[context.preprd.environment]
    ENV = "dotcomstg"

[context.deploy-preview.environment]
    ENV = "prd"

[context.branch-deploy.environment]
    ENV = "prd"

[context.preview-server.environment]
    ENV = "prd"
  
[context.dev.environment]
    ENV = "stg"

ALLOW_INACTIVE_VERSIONS = true
[[redirects]]
  from = "/docs/kubernetes/v1.11/reference/support-lifecycle/"
  to = "https://www.mongodb.com/legal/support-policy/lifecycles"
