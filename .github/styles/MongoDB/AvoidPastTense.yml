extends: existence
message: 'Avoid using past tense where possible: "%s".'
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-present-tense/'
ignorecase: true
level: suggestion
scope: sentence
# Only simple past forms that differ from the past participle. Participles
# ("shown", "given", "written") usually appear in present-tense passive or
# adjectival phrases ("the output shown here"), and forms that are identical
# in both ("built", "found", "sent") can't be told apart by a token list.
tokens:
  - arose
  - ate
  - awoke
  - bade
  - became
  - began
