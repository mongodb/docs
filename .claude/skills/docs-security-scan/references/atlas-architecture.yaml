# Security-scan manifest for the Atlas Architecture Center docset.
# Conforms to references/SCHEMA.md.

docset: atlas-architecture
# Verified DOCSP Jira components (DOCSP-65593, DOCSP-65566).
component:
  - "Atlas Architecture Center"

docs:
  path: content/atlas-architecture/upcoming

security_considerations:

  - id: atlas-architecture-no-wildcard-ip-access-list
    # Grounded in compliance.txt, "Block Usage of the Wildcard IP Address".
    rule: >-
      Architecture and recommendation prose must not propose or imply a
      project IP access list or firewall rule set that includes the wildcard
      IP address 0.0.0.0/0 (or any IPv4 /0 CIDR); the guidance throughout the
      Architecture Center is to limit cluster access to explicitly permitted
      IP addresses, including in landing-zone, compliance, and
      reference-architecture examples.
    applies_to: ["network security", "compliance", "landing zone", "reference architecture"]
    category: counter_best_practice_advice
    severity: High

  - id: atlas-architecture-service-account-least-privilege
    # Grounded in auth/authentication.txt and hierarchy.txt.
    rule: >-
      Architecture prose that sets up organizations, projects, service
      accounts, or Atlas Administration API keys should assign the least
      privileged Atlas role required for the intended purpose and keep
      project isolation, not organization-wide roles, where a project-scoped
      role suffices. Extends universal U-5 to Atlas control-plane roles,
      which U-5's database-user scope does not cover.
    applies_to: ["hierarchy", "auth", "getting started", "landing zone"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # No markers: no callout in the built AST caveats an insecure example.

validation: {}
