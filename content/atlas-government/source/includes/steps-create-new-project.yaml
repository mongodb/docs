title: "Navigate to the :guilabel:`Create a Project` page."
stepnum: 1
level: 4
ref: project-nav-create-project
content: |

  a. Select an organization for which to create a project from 
     the |ui-org-menu| in the navigation bar.

  #. Click the :guilabel:`Leaf` icon in the upper left corner of the
     page or expand the :guilabel:`Projects` menu in the navigation
     bar.

  #. Click :guilabel:`New Project`.

---
title: "Enter the name for your new project."
stepnum: 2
level: 4
ref: project-enter-name
---
title: "Designate your project as {+fedramp-c+} or {+fedramp-d+}."
stepnum: 2
level: 4
ref: project-designate-gov
content: |

  a. To create a {+fedramp-d+} project, check
     :guilabel:`FedRAMP Class D (High) - Regions Only`.

     Regions certified for {+fedramp-d+} include |aws-fr-high|
     (US) regions, |gaw| (US) regions, and |azure-gov| (US)
     regions. If you leave this option unselected, you can deploy
     |aws| clusters only to |aws-fr-moderate| (US) regions, which
     are certified for {+fedramp-c+}. You cannot deploy clusters
     within the same project across both {+fedramp-d+} and
     {+fedramp-c+} regions.

  #. Click :guilabel:`Next`.

---
title: "Add members."
stepnum: 3
level: 4
ref: project-add-members
content: |

  a. For existing |cloudgov-short| users, enter the email 
     that the person used to register.

  b. For new |cloudgov-short| users, enter their email 
     address to send an invitation.

