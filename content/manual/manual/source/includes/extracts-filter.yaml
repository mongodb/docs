   .. selected-content::
      :selections: driver, kotlin-coroutine

      To specify equality conditions, use the
      `Filters.eq()
      <{+java-api-docs+}/driver-core/com/mongodb/client/model/Filters.html#eq(java.lang.String,TItem)>`__
      method to create the :ref:`query filter document <document-query-filter>`:

      .. code-block:: kotlin

         and(eq(<field1>, <value1>), eq(<field2>, <value2>) ...)

