<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Atlas Core with attached storage (neutral)</title>
<desc>A compact, neutral diagram on a white background using greys and slate only. Across three zones (Zone A, Zone B, Zone C), a Compute layer holds a Primary mongod and two Secondary mongod nodes. Below each compute node, a Storage layer holds its own attached Storage Disk. A note states that storage is attached to each compute node.</desc>

<rect x="0" y="0" width="480" height="250" fill="#FFFFFF"/>

<text x="20" y="22" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#001E2B">Atlas Core</text>

<!-- Zone headers -->
<text x="146" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5C6C75">Zone A</text>
<text x="270" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5C6C75">Zone B</text>
<text x="394" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5C6C75">Zone C</text>

<!-- Compute layer -->
<text x="44" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#001E2B">Compute</text>
<rect x="88" y="64" width="116" height="56" rx="8" fill="#FFFFFF" stroke="#B8C2C0" stroke-width="1.1"/><text x="146" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#001E2B">Primary</text><text x="146" y="101" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5C6C75">mongod</text>
<rect x="212" y="64" width="116" height="56" rx="8" fill="#FFFFFF" stroke="#B8C2C0" stroke-width="1.1"/><text x="270" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#001E2B">Secondary</text><text x="270" y="101" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5C6C75">mongod</text>
<rect x="336" y="64" width="116" height="56" rx="8" fill="#FFFFFF" stroke="#B8C2C0" stroke-width="1.1"/><text x="394" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#001E2B">Secondary</text><text x="394" y="101" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#5C6C75">mongod</text>

<!-- attach connectors -->
<line x1="146" y1="120" x2="146" y2="152" stroke="#9AA6A2" stroke-width="1.2"/>
<line x1="270" y1="120" x2="270" y2="152" stroke="#9AA6A2" stroke-width="1.2"/>
<line x1="394" y1="120" x2="394" y2="152" stroke="#9AA6A2" stroke-width="1.2"/>

<!-- Storage layer -->
<text x="44" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#001E2B">Storage</text>
<rect x="88" y="152" width="116" height="56" rx="8" fill="#EEF1F0" stroke="#B8C2C0" stroke-width="1.1"/><text x="146" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3D4F58">Storage Disk</text>
<rect x="212" y="152" width="116" height="56" rx="8" fill="#EEF1F0" stroke="#B8C2C0" stroke-width="1.1"/><text x="270" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3D4F58">Storage Disk</text>
<rect x="336" y="152" width="116" height="56" rx="8" fill="#EEF1F0" stroke="#B8C2C0" stroke-width="1.1"/><text x="394" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3D4F58">Storage Disk</text>

<text x="240" y="230" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5C6C75">Storage is attached to each compute node.</text>
</svg>
