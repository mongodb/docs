# AWS Translate arm B: custom terminology attached.
#
# Requires AWS_TRANSLATE_TERMINOLOGY_NAME=aws-translate-glossary in the
# environment; the suite config has no field for it. The terminology must have
# been uploaded with `pnpm sync-terminology` first, and AWS takes up to ten
# minutes to propagate a new import.
#
# Run of record: data/manual/manual/aws-translate-glossary/
# Braintrust experiment: "manual/manual es aws-translate-glossary [aws-translate -> gpt-6-astra]"
#
# The suite name differs from the run's directory name so that running this
# config does not write into the manual run's directory.
#
# Caveat: the suite runs `dataset` after `serve` has overwritten
# content-mdx/<project>, and `dataset` reads the English source from there, so
# a suite run scores `glossary_terms_used` against Spanish segments. The run of
# record above was produced by running the stages manually and restoring the
# pristine content-mdx before `dataset`, so its glossary scores are valid.
#
# Run: AWS_TRANSLATE_TERMINOLOGY_NAME=aws-translate-glossary \
#        pnpm suite --config suites/aws-glossary.yaml
name: aws-glossary

project: manual/manual
pages: pages/manual.txt
locales: [es]

# Same judge as the 2026-11-10 AWS experiments, for comparability.
judge: gpt-6-astra

repeats: 1

translators:
  - { backend: aws-translate }
