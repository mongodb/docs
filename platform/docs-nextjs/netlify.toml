# For handling Kanopy routing distinction between mongodb.com and products/updates _next/static request we needed to use 
# assetPrefix to move products/updates _next/static under /docs allowing for request coming from Kanopy to be handled by B2k and NextJs
# This redirect handles NextJs assuming _next/static to be under docs but when deployed in to our CDN the static folder sits at the root
# See EPIC below for more context
# https://jira.mongodb.org/browse/DOP-6064

[build.environment]
SECRETS_SCAN_ENABLED = "false"
NEXTJS_EXTENSION_ENABLED = "true"
NEXTJS_EXTENSION_ENABLED_STAGING = "false"
NEXTJS_EXTENSION_ENABLED_STAGING_2 = "false"

[context.production.environment]
    ENV = "dotcomprd"
    # Only the production context may emit an indexable robots meta tag. Every
    # other context omits this and fails closed. See src/utils/seo.tsx.
    NEXT_PUBLIC_ALLOW_INDEXING = "true"

[context.preprd.environment]
    ENV = "dotcomstg"

[context.deploy-preview.environment]
    ENV = "prd"

[context.branch-deploy.environment]
    ENV = "prd"

[context.preview-server.environment]
    ENV = "prd"

[context.dev.environment]
    ENV = "stg"
    
# Netlify adds this header to Deploy Previews on its own, but not to Branch
# Deploys.
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
from = "/docs/docs_static_nextjs/_next/*"
to = "/_next/:splat"
status = 200

# Remove when going live with Atlas Agent Engine
[[redirects]]
from = "/docs/agentic-platform/*"
to = "https://deploy-preview-21159--agentengine-docs.netlify.app/docs/agentengine/:splat"
status = 301
force = true

[dev]
framework = "next"
command = "next dev"
publish = ".next"

[build]
# Mints CodeArtifact auth when NPM_AWS_KEY is set; see platform/scripts/install-deps.mjs.
command = '''
set -euo pipefail
cd platform/docs-nextjs
node ../scripts/install-deps.mjs
pnpm run build
'''