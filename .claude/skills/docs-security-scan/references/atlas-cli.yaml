# Security-scan manifest for the Atlas CLI docset. Conforms to
# references/SCHEMA.md.

docset: atlas-cli
# Verified DOCSP Jira components (DOCSP-66010).
component:
  - "Atlas CLI"

docs:
  path: content/atlas-cli/upcoming
  # Everything except the generated command/* reference, whose fixes belong in the Atlas CLI source.
  surface_pages:
    - "atlas-cli-*.txt"
    - "atlas-local-changelog.txt"
    - "compatibility.txt"
    - "connect-atlas-cli.txt"
    - "custom-output-cli.txt"
    - "index.txt"
    - "install-atlas-cli.txt"
    - "migrate-to-atlas-cli.txt"
    - "plugin-changelogs.txt"
    - "reference.txt"
    - "reference/json.txt"
    - "reference/json/*.txt"
    - "telemetry.txt"
    - "troubleshooting.txt"
    - "verify-packages.txt"

security_considerations:

  - id: atlas-cli-profile-credentials-secure-storage
    # Grounded in connect-atlas-cli.txt.
    rule: >-
      Prose and examples that store Atlas credentials (API keys, service
      account client secrets, authentication tokens) in the Atlas CLI
      configuration file as a profile must carry the docset's own caveat
      that API keys are like passwords and that Atlas CLI 1.47+ stores
      credentials securely, and programmatic authentication guidance should
      prefer the MONGODB_ATLAS_CLIENT_ID and MONGODB_ATLAS_CLIENT_SECRET
      environment variables over profile-stored keys.
    applies_to: ["connect", "profile", "environment"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # Taken from callouts in the built Atlas CLI AST.
  - directive: note
    phrases:
      # atlas-cli-quickstart.txt: the printed setup output shows an example database password.
      - "random autogenerated value"
