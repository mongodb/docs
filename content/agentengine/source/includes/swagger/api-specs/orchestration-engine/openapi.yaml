externalDocs:
  description: ""
  url: ""
info:
  description: Internal orchestration service for the MongoDB Agentic Platform.
  title: Orchestration Engine API
  version: "1.0"
openapi: 3.1.0
paths:
  /:
    get:
      description: Returns basic service identity information.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.RootInfoResponse'
          description: OK
      summary: Service info
      tags:
      - Health
  /a2a/discover:
    get:
      description: Returns agents that are A2A-enabled and visible to the caller,
        filtered by project, skills, capabilities, and input modes. Requires a valid
        A2A JWT.
      parameters:
      - description: Filter by project ID (defaults to OE's own project)
        in: query
        name: project_id
        schema:
          type: string
      - description: Filter by skill names
        in: query
        name: skills
        schema:
          items:
            type: string
          type: array
      - description: Filter by capability tags
        in: query
        name: capabilities
        schema:
          items:
            type: string
          type: array
      - description: Filter by input MIME types
        in: query
        name: input_modes
        schema:
          items:
            type: string
          type: array
      - description: Max results (default 50, max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/main.DiscoveredAgent'
                  type: array
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Service Unavailable
      summary: Discover A2A agents
      tags:
      - A2A
  /a2a/invoke:
    post:
      description: Validates the caller's A2A JWT, looks up the target agent, enforces
        org/project isolation and allowed-callers policy, creates a child execution,
        dispatches to the target AER, and polls for the result.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/main.A2AInvokeRequest'
                description: Invoke request
                summary: body
        description: Invoke request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.A2AInvokeResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Service Unavailable
      summary: Invoke agent via A2A
      tags:
      - A2A
  /a2a/register:
    post:
      description: Called by the AER at startup to register its A2A config (skills,
        endpoints, allowed callers) in the OE's local a2a_agents collection. Requires
        a valid A2A JWT.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/main.A2ARegisterRequest'
                description: Registration request
                summary: body
        description: Registration request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Service Unavailable
      summary: Register A2A agent configuration
      tags:
      - A2A
  /api/v1/{memoryPath}:
    delete:
      description: 'Forwards whitelisted /api/v1/* memory requests to the memory server
        pod. Supported path prefixes: stm/, context/, semantic, episodic, procedural,
        retrieval/, taxonomic, user-context, ingest. Non-whitelisted paths return
        404. Note: memoryPath supports nested sub-paths (e.g. stm/foo/bar); the OpenAPI
        {memoryPath} parameter is an approximation of Gin''s wildcard *memoryPath.
        The 400 response for invalid JSON is returned as plain text, not JSON.'
      parameters:
      - description: Memory API sub-path (supports nested paths)
        in: path
        name: memoryPath
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
