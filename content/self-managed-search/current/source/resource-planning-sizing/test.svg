<svg version="1.1" viewBox="0 0 1280 960" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- ============================================================
       mongot co-located architecture (Community Edition)
       Single host, single-node replica set.
       All text is editable <text>; colors/coords are grouped.
       ============================================================ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#001E2B"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 z" fill="#001E2B"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1280" height="960" fill="#ffffff"/>
  <!-- outer container -->
  <rect x="30" y="30" width="1220" height="890" rx="6" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>

  <!-- =================== TOP: client interactions =================== -->
  <!-- Application / Compass / Driver box -->
  <g>
    <rect x="80" y="95" width="380" height="125" rx="8" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
    <!-- search-window icon -->
    <rect x="105" y="118" width="80" height="58" rx="4" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
    <rect x="105" y="118" width="80" height="14" rx="4" fill="#00ED64"/>
    <circle cx="140" cy="152" r="12" fill="none" stroke="#00684A" stroke-width="2.5"/>
    <line x1="149" y1="161" x2="158" y2="170" stroke="#00684A" stroke-width="2.5"/>
    <!-- compass icon -->
    <circle cx="270" cy="147" r="30" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
    <path d="M258,160 L278,138 L272,158 Z" fill="#00ED64" stroke="#00684A" stroke-width="1"/>
    <!-- code-window icon -->
    <rect x="355" y="118" width="80" height="58" rx="4" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
    <rect x="355" y="118" width="80" height="14" rx="4" fill="#00ED64"/>
    <text x="395" y="150" text-anchor="middle" font-family="monospace" font-size="13" fill="#001E2B">1 0 1 1</text>
    <text x="395" y="167" text-anchor="middle" font-family="monospace" font-size="13" fill="#001E2B">1 0 1 1</text>
    <text x="270" y="205" text-anchor="middle" font-size="20" fill="#001E2B">Application &#183; Compass &#183; Driver</text>
  </g>

  <!-- user (developer) -->
  <g>
    <circle cx="1150" cy="128" r="22" fill="none" stroke="#001E2B" stroke-width="2"/>
    <path d="M1112,190 a38,38 0 0 1 76,0 Z" fill="none" stroke="#001E2B" stroke-width="2"/>
    <circle cx="1108" cy="150" r="28" fill="#00ED64"/>
    <path d="M1062,222 a46,46 0 0 1 92,0 Z" fill="#00ED64"/>
  </g>

  <!-- client <-> user flows -->
  <line x1="460" y1="130" x2="1050" y2="130" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="122" font-size="16" fill="#001E2B">$search &#183; $searchMeta &#183; $vectorSearch</text>

  <line x1="460" y1="180" x2="1050" y2="180" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="172" font-size="16" fill="#001E2B">Search Index Management</text>

  <line x1="1050" y1="235" x2="460" y2="235" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="255" font-size="16" fill="#001E2B">Search Results &amp; Matching Documents</text>

  <!-- app -> mongod (data path) -->
  <line x1="170" y1="220" x2="170" y2="462" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215" y1="220" x2="215" y2="462" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="220" x2="260" y2="462" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =================== DATABASE HOST =================== -->
  <rect x="80" y="320" width="1140" height="560" rx="16" fill="#E3FCF7" stroke="#00684A" stroke-width="1.5"/>
  <text x="650" y="370" text-anchor="middle" font-size="26" font-weight="bold" fill="#001E2B">Database Host (single host)</text>

  <!-- mongod, single-node replica set -->
  <g>
    <rect x="130" y="470" width="210" height="180" rx="24" fill="#ffffff" stroke="#001E2B" stroke-width="3"/>
    <text x="235" y="508" text-anchor="middle" font-size="20" fill="#001E2B">mongod</text>
    <circle cx="235" cy="562" r="46" fill="#00ED64"/>
    <text x="235" y="574" text-anchor="middle" font-family="monospace" font-size="34" fill="#001E2B">{ }</text>
    <text x="235" y="678" text-anchor="middle" font-size="15" fill="#00684A">single-node replica set</text>
  </g>

  <!-- MongoDB Java Driver (used by mongot to reach mongod) -->
  <g>
    <rect x="560" y="450" width="170" height="120" rx="8" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
    <rect x="610" y="468" width="70" height="46" rx="4" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
    <rect x="610" y="468" width="70" height="12" rx="4" fill="#00ED64"/>
    <text x="645" y="497" text-anchor="middle" font-family="monospace" font-size="11" fill="#001E2B">1 0 1 1</text>
    <text x="645" y="509" text-anchor="middle" font-family="monospace" font-size="11" fill="#001E2B">1 0 1 1</text>
    <text x="645" y="537" text-anchor="middle" font-size="14" fill="#001E2B">MongoDB</text>
    <text x="645" y="555" text-anchor="middle" font-size="14" fill="#001E2B">Java Driver</text>
  </g>

  <!-- mongot cylinder -->
  <g>
    <path d="M850,415 L850,810 A160,24 0 0 0 1170,810 L1170,415" fill="#ffffff" stroke="#00684A" stroke-width="2"/>
    <ellipse cx="1010" cy="415" rx="160" ry="24" fill="#ffffff" stroke="#00684A" stroke-width="2"/>
    <text x="1010" y="422" text-anchor="middle" font-size="22" fill="#001E2B">mongot</text>

    <rect x="880" y="465" width="185" height="52" rx="6" fill="#F3EDFB" stroke="#C2A9E8" stroke-width="1.5"/>
    <text x="972" y="497" text-anchor="middle" font-size="16" fill="#001E2B">Replication</text>

    <rect x="880" y="540" width="185" height="64" rx="6" fill="#F3EDFB" stroke="#C2A9E8" stroke-width="1.5"/>
    <text x="972" y="567" text-anchor="middle" font-size="16" fill="#001E2B">Index Catalog</text>
    <text x="972" y="587" text-anchor="middle" font-size="16" fill="#001E2B">Management</text>

    <rect x="880" y="627" width="185" height="52" rx="6" fill="#F3EDFB" stroke="#C2A9E8" stroke-width="1.5"/>
    <text x="972" y="659" text-anchor="middle" font-size="16" fill="#001E2B">Query Server</text>

    <!-- decorative icons -->
    <circle cx="1105" cy="491" r="13" fill="none" stroke="#00684A" stroke-width="2"/>
    <circle cx="1105" cy="491" r="4" fill="#00ED64"/>
    <rect x="1092" y="560" width="10" height="10" fill="#00ED64"/>
    <circle cx="1118" cy="565" r="5" fill="#00684A"/>
    <rect x="1092" y="575" width="10" height="10" fill="#00684A"/>
    <circle cx="1118" cy="580" r="5" fill="#00ED64"/>
    <path d="M1096,644 l12,0 l6,10 l-6,10 l-12,0 l-6,-10 z" fill="none" stroke="#00684A" stroke-width="2"/>
    <circle cx="1105" cy="654" r="3" fill="#00ED64"/>
  </g>

  <!-- ============ CONNECTORS ============ -->
  <!-- TOP PATH: mongot (Replication / Index Catalog) -> Java Driver -> mongod : wire protocol via Java Driver -->
  <line x1="880" y1="491" x2="734" y2="480" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="455" text-anchor="middle" font-size="13" fill="#001E2B">Initial Sync &amp;</text>
  <text x="805" y="470" text-anchor="middle" font-size="13" fill="#001E2B">Change Streams</text>

  <line x1="880" y1="572" x2="734" y2="545" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="807" y="538" text-anchor="middle" font-size="13" fill="#001E2B">Index Catalog Data</text>

  <line x1="558" y1="512" x2="344" y2="545" stroke="#001E2B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="500" text-anchor="middle" font-size="13" fill="#00684A">MongoDB wire protocol</text>

  <!-- BOTTOM PATH: mongod <-> mongot Query Server : OP_MSG over TCP socket -->
  <path d="M580,700 l70,-32 l70,32 l-70,32 z" fill="#ffffff" stroke="#001E2B" stroke-width="1.5"/>
  <text x="650" y="691" text-anchor="middle" font-size="11" fill="#001E2B">MongoDB wire</text>
  <text x="650" y="704" text-anchor="middle" font-size="11" fill="#001E2B">protocol (OP_MSG)</text>
  <text x="650" y="717" text-anchor="middle" font-size="11" fill="#001E2B">over TCP socket</text>

  <line x1="340" y1="620" x2="578" y2="695" stroke="#001E2B" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <line x1="722" y1="695" x2="878" y2="653" stroke="#001E2B" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="555" y="600" text-anchor="middle" font-size="13" fill="#001E2B">Search Queries &amp; Search Results</text>
  <text x="555" y="618" text-anchor="middle" font-size="13" fill="#001E2B">Index Management Commands</text>
</svg>
