      description: Handles the identity provider callback. Validates the CSRF state,
        exchanges the authorization code for tokens via PKCE, finds or creates a user,
        and redirects to the UI with a one-time code.
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        schema:
          type: string
      - description: CSRF state
        in: query
        name: state
        required: true
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect to UI with one-time code
      summary: OIDC callback endpoint
      tags:
      - Auth
  /auth/oidc/exchange:
    post:
      description: The frontend or CLI calls this endpoint with a one-time code received
        from the OIDC callback to obtain local JWT access and refresh tokens.
      requestBody:
        content:
          text/plain:
            schema:
              title: body
              type: object
        description: One-time code
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: JWT tokens
        "400":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Service Unavailable
      summary: Exchange one-time code for JWT tokens
      tags:
      - Auth
  /auth/oidc/start:
    get:
      description: Validates the auth_start transaction ID, generates PKCE/nonce/state,
        stores them in a cookie, and redirects to the identity provider.
      parameters:
      - description: Transaction ID (hash of auth_start state)
        in: query
        name: tx
        required: true
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect to identity provider
        "400":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal Server Error
      summary: Start OIDC login flow
      tags:
      - Auth
  /auth/signup:
    post:
      description: Creates a password user in local/dev only, requiring an invitation
        code before applying the code-matched pending invitation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/main.SignupRequest'
              description: Signup request
              summary: body
        description: Signup request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.UserDTO'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Internal Server Error
      summary: Sign up with pending invitation
      tags:
      - Auth
  /auth/start:
    get:
      description: Starts login through the account app when configured, or directly
        through the identity provider for local deployments.
      parameters:
      - description: Post-login redirect URI
        in: query
        name: post_login_uri
        schema:
          type: string
      responses:
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Redirect to account app or identity provider
        "400":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal Server Error
      summary: Start authentication flow
      tags:
      - Auth
  /auth/token:
    post:
      description: Authenticates a user with username and password and returns a JWT
        token pair.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - title: username
                type: string
              - title: password
                type: string
        description: Username | Password
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.TokenPair'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal Server Error
      summary: Login
      tags:
      - Auth
  /auth/token/next:
    post:
      description: Exchanges a refresh token for a new JWT token pair.
      requestBody:
        content:
          text/plain:
            schema:
              title: body
              type: object
        description: Refresh token request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.TokenPair'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
      summary: Refresh token
      tags:
      - Auth
  /health:
    get:
      description: Returns the health status of the API Gateway and its dependent
        services.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.HealthResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.HealthResponse'
          description: Service Unavailable
      summary: Health check
      tags:
      - Health
  /users:
    get:
      description: Returns every user in the system, sorted by creation date descending.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.UserListResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Users
    post:
      description: Creates a new user with the given credentials and org memberships.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/main.UserCreateRequest'
              description: User to create
              summary: body
        description: User to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.UserDTO'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - Users
  /users/{id}:
