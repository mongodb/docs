components:
  schemas:
    main.APIRoleAssignment:
      properties:
        org_id:
          type: string
        project_id:
          type: string
        role:
          type: string
      type: object
    main.AddOrgUserRequest:
      properties:
        role:
          type: string
        user_id:
          type: string
      required:
      - role
      - user_id
      type: object
    main.AddProjectUserRequest:
      properties:
        role:
          description: Must be a project-level role
          type: string
        user_id:
          description: Email of the user to add
          type: string
      required:
      - role
      - user_id
      type: object
    main.AgentCard:
      properties:
        a2a_allowed_callers:
          description: |-
            A2AAllowedCallers restricts which workspace IDs may invoke this agent
            via A2A. An empty list means any caller is permitted.
          items:
            type: string
          type: array
          uniqueItems: false
        a2a_enabled:
          description: A2AEnabled controls whether this agent is discoverable for
            A2A calls.
          type: boolean
        capabilities:
          items:
            type: string
          type: array
          uniqueItems: false
        input_modes:
          description: InputModes lists MIME types the agent accepts (e.g. "text/plain",
            "application/json").
          items:
            type: string
          type: array
          uniqueItems: false
        output_modes:
          description: OutputModes lists MIME types the agent can produce.
          items:
            type: string
          type: array
          uniqueItems: false
        skills:
          description: Skills advertises discrete tasks the agent can perform.
          items:
            $ref: '#/components/schemas/main.AgentSkill'
          type: array
          uniqueItems: false
        summary:
          type: string
      type: object
    main.AgentLogEntry:
      properties:
        executionId:
          type: string
        fields:
          additionalProperties: {}
          type: object
        level:
          type: string
        logger:
          type: string
        message:
          type: string
        podName:
          type: string
        service:
          type: string
        sessionId:
          type: string
        source:
          type: string
        tenantId:
          type: string
        timestamp:
          type: string
        workspaceId:
          type: string
      type: object
    main.AgentLogsResponse:
      properties:
        hasMore:
          type: boolean
        logs:
          items:
            $ref: '#/components/schemas/main.AgentLogEntry'
          type: array
          uniqueItems: false
        nextCursor:
          type: string
      type: object
    main.AgentSkill:
      properties:
        description:
          type: string
        example_input:
          type: string
        example_output:
          type: string
        name:
          type: string
      type: object
    main.AuthToken:
      description: Metadata about the token
      properties:
        created_at:
          type: string
        created_by:
          description: Who/what created this token
          type: string
        description:
          description: Human-readable description
          type: string
        expires_at:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        last_used_at:
          description: Track usage
          type: string
        project_id:
          description: Project this token belongs to
          type: string
        revoked_at:
          type: string
        revoked_by:
          type: string
        token_prefix:
          description: Bounded lookup prefix for identification (e.g., "agp_live_sk_<partial-random>")
          type: string
        user_id:
          description: User who owns this token
          type: string
      type: object
    main.AuthenticatedResponse:
      properties:
        data: {}
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/main.User'
      type: object
    main.CheckpointSession:
      properties:
        created_at:
          type: string
        first_message_preview:
          type: string
        last_activity:
          type: string
        message_count:
          type: integer
        project_id:
          type: string
        session_id:
          type: string
        user_id:
          type: string
        visibility:
          type: string
        workspace_id:
          type: string
      type: object
    main.CostByModel:
      properties:
        call_count:
          type: integer
        model:
          type: string
        percentage:
          type: number
        total_cost_usd:
          type: number
        total_tokens:
          type: integer
      type: object
    main.CostByWorkspace:
      properties:
        call_count:
          type: integer
        percentage:
          type: number
        total_cost_usd:
          type: number
        total_tokens:
          type: integer
        workspace_id:
          type: string
      type: object
    main.CostDashboardResponse:
      properties:
        by_model:
          items:
            $ref: '#/components/schemas/main.CostByModel'
          type: array
          uniqueItems: false
        by_workspace:
          items:
            $ref: '#/components/schemas/main.CostByWorkspace'
          type: array
          uniqueItems: false
        daily_trend:
          items:
            $ref: '#/components/schemas/main.DailyCostEntry'
          type: array
          uniqueItems: false
        success:
          type: boolean
        summary:
          $ref: '#/components/schemas/main.CostSummary'
      type: object
    main.CostSummary:
      properties:
        total_completion_tokens:
          type: integer
        total_cost_usd:
          type: number
        total_llm_calls:
          type: integer
        total_prompt_tokens:
          type: integer
        total_tokens:
          type: integer
        unpriced_llm_calls:
          type: integer
      type: object
    main.CreateAPIKeyRequest:
      properties:
        description:
          type: string
        expires_in:
          description: 'Optional: days until expiration (0 = never)'
          type: integer
      type: object
    main.CreateAPIKeyResponse:
      properties:
        api_key:
          description: The actual key (only shown once!)
          type: string
        message:
          description: Warning message
          type: string
        success:
          type: boolean
        token_info:
          $ref: '#/components/schemas/main.AuthToken'
      type: object
    main.DailyCostEntry:
      properties:
        call_count:
          type: integer
        date:
          type: string
        total_cost_usd:
          type: number
        total_tokens:
          type: integer
      type: object
    main.ErrorResponse:
      properties:
        code:
          type: string
        error:
          type: string
        success:
          type: boolean
      type: object
    main.Execution:
      properties:
        created_at:
          type: string
        error:
          type: string
        execution_id:
          type: string
        message:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        result: {}
        session_id:
          type: string
        status:
          description: '"pending", "running", "suspended", "completed", "error"'
          type: string
        suspend_context:
          additionalProperties: {}
          type: object
        suspend_reason:
          type: string
        thread_id:
          type: string
        updated_at:
          type: string
        user_id:
          type: string
      type: object
    main.ExecutionLog:
      properties:
        completion_tokens:
          type: integer
        cost_usd:
          type: number
        duration_ms:
          type: number
        error:
          type: string
        execution_id:
          type: string
        id:
          type: string
        inputs:
          additionalProperties: {}
          type: object
        kind:
          description: Kind is "llm" for LLM calls, "tool" for ordinary tools, and
            "memory" for memory operations.
          enum:
          - llm
          - tool
          - memory
          type: string
        metadata:
          additionalProperties: {}
          type: object
        model:
          type: string
        org_id:
          type: string
        output: {}
        pod_name:
          description: Hostname/pod name where tool was executed
          type: string
        project_id:
          type: string
        prompt_tokens:
          description: Token usage and cost fields (populated for invoke_llm calls)
          type: integer
        session_id:
          type: string
        span_id:
          type: string
        status:
          description: '"started", "success", "error"'
          type: string
        thread_id:
          type: string
        timestamp:
          $ref: '#/components/schemas/main.FlexTime'
        tool:
          type: string
        total_tokens:
          type: integer
        trace_id:
          type: string
        user_id:
          type: string
        workspace_id:
          type: string
      type: object
    main.ExecutionLogsResponse:
      properties:
        count:
          type: integer
        logs:
          items:
            $ref: '#/components/schemas/main.ExecutionLog'
          type: array
          uniqueItems: false
        success:
          type: boolean
      type: object
    main.ExecutionStatusResponse:
      properties:
        error:
          type: string
        execution:
          $ref: '#/components/schemas/main.Execution'
        success:
          type: boolean
      type: object
    main.ExecutionsListResponse:
      properties:
        count:
          type: integer
        executions:
          items:
            $ref: '#/components/schemas/main.Execution'
          type: array
          uniqueItems: false
        success:
          type: boolean
      type: object
    main.FlexTime:
      properties:
        time.Time:
          type: string
      type: object
    main.HealthResponse:
      properties:
        message:
          type: string
        services:
          additionalProperties:
            $ref: '#/components/schemas/main.ServiceHealth'
          type: object
        status:
          type: string
      type: object
    main.InvokeWorkspaceRequest:
      properties:
        message:
          type: string
        session_id:
          description: 'Optional: alternative to thread_id'
          type: string
        thread_id:
          description: 'Optional: for conversation continuity'
          type: string
        user_id:
          description: 'Optional: for user context'
          type: string
      required:
      - message
      type: object
    main.InvokeWorkspaceResponse:
      properties:
        error:
          type: string
        execution_id:
          type: string
        response:
          type: string
        success:
          type: boolean
      type: object
    main.ListAPIKeysResponse:
      properties:
        count:
          type: integer
        keys:
          items:
            $ref: '#/components/schemas/main.AuthToken'
          type: array
          uniqueItems: false
        success:
          type: boolean
      type: object
    main.Message:
      properties:
        content:
          type: string
        id:
          type: string
        name:
          description: Tool name for tool messages
          type: string
        role:
          type: string
        session_id:
          type: string
        timestamp:
          type: string
      type: object
    main.NodeExecution:
      properties:
        description:
          description: Computed field, not stored in DB
          type: string
        duration_ms:
          type: number
        error:
          type: string
        execution_id:
          type: string
        id:
          type: string
        inputs:
          additionalProperties: {}
          type: object
        node:
          type: string
        org_id:
          type: string
        outputs:
          additionalProperties: {}
          type: object
        parent_run_id:
          type: string
        project_id:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        status:
          description: '"started", "success", "error"'
          type: string
        thread_id:
          type: string
        timestamp:
          $ref: '#/components/schemas/main.FlexTime'
        user_id:
          type: string
      type: object
    main.NodeExecutionsResponse:
      properties:
        count:
          type: integer
        executions:
          items:
            $ref: '#/components/schemas/main.NodeExecution'
          type: array
          uniqueItems: false
        success:
          type: boolean
      type: object
    main.OrgUserDTO:
      properties:
        created_at:
          type: string
        invitation_code:
          type: string
        org_membership_status:
          type: string
        role_assignments:
          items:
            $ref: '#/components/schemas/main.RoleAssignment'
          type: array
          uniqueItems: false
        updated_at:
          type: string
        user_id:
          type: string
      type: object
    main.OrgUserListResponse:
      properties:
        total:
          type: integer
        users:
          items:
            $ref: '#/components/schemas/main.OrgUserDTO'
          type: array
          uniqueItems: false
      type: object
    main.OrganizationCreateRequest:
      properties:
        description:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    main.OrganizationDTO:
      properties:
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        updated_at:
          type: string
      type: object
    main.OrganizationListResponse:
      properties:
        organizations:
          items:
            $ref: '#/components/schemas/main.OrganizationDTO'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    main.OrganizationUpdateRequest:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    main.ProjectCreateRequest:
      properties:
        allow_member_invites:
          type: boolean
        description:
          type: string
        name:
          type: string
        sharing_policy:
          $ref: '#/components/schemas/main.ProjectSharingPolicy'
      required:
      - name
      type: object
    main.ProjectDTO:
      properties:
        allow_member_invites:
          type: boolean
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        org_id:
          type: string
        sharing_policy:
          $ref: '#/components/schemas/main.ProjectSharingPolicy'
        updated_at:
          type: string
      type: object
    main.ProjectDeleteConflictDetails:
      properties:
        truncated:
          description: |-
            Truncated is true when WorkspaceCount exceeds the cap and the
            preview is partial.
          type: boolean
        workspace_count:
          description: WorkspaceCount is the total active workspace count in the project.
          type: integer
        workspace_ids:
          description: |-
            WorkspaceIDs is the first N (currently 10) active workspace IDs.
            Capped to keep the response bounded for projects with many workspaces.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    main.ProjectDeleteConflictResponse:
      properties:
        code:
          type: string
        detail:
          description: alias of Error for UI ApiError compatibility
          type: string
        details:
          $ref: '#/components/schemas/main.ProjectDeleteConflictDetails'
        error:
          type: string
        success:
          type: boolean
      type: object
    main.ProjectListResponse:
      properties:
        projects:
          items:
            $ref: '#/components/schemas/main.ProjectDTO'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    main.ProjectSharingPolicy:
      properties:
        allowed_sources:
          items:
            type: string
          type: array
          uniqueItems: false
        share_modes:
          items:
            type: string
          type: array
          uniqueItems: false
        shareable:
          type: boolean
      type: object
    main.ProjectUpdateRequest:
      properties:
        allow_member_invites:
          type: boolean
        description:
          type: string
        name:
          type: string
        sharing_policy:
          $ref: '#/components/schemas/main.ProjectSharingPolicy'
      type: object
    main.ProjectUserDTO:
      properties:
        created_at:
          type: string
        invitation_code:
          type: string
        org_id:
          type: string
        project_membership_status:
          type: string
        roles:
          items:
            $ref: '#/components/schemas/main.RoleAssignment'
          type: array
          uniqueItems: false
        updated_at:
          type: string
        user_id:
          type: string
      type: object
    main.ProjectUserListResponse:
      properties:
        total:
          type: integer
        users:
          items:
            $ref: '#/components/schemas/main.ProjectUserDTO'
          type: array
          uniqueItems: false
      type: object
    main.ResumeExecutionRequest:
      properties:
        decision:
          type: string
        reviewer_notes:
          type: string
      required:
      - decision
      type: object
    main.ResumeExecutionResponse:
      properties:
        error:
          type: string
        execution_id:
          type: string
        status:
          type: string
        success:
          type: boolean
      type: object
    main.RoleAssignment:
      properties:
        org_id:
          type: string
        project_id:
          type: string
        role:
          type: string
      type: object
    main.ServiceHealth:
      properties:
        message:
          type: string
        status:
          type: string
      type: object
    main.SessionMessagesResponse:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/main.Message'
          type: array
          uniqueItems: false
      type: object
    main.SessionsListResponse:
      properties:
        limit:
          type: integer
        offset:
          type: integer
        sessions:
          items:
            $ref: '#/components/schemas/main.CheckpointSession'
          type: array
          uniqueItems: false
        total_count:
          type: integer
      type: object
    main.SignupRequest:
      properties:
        email:
          type: string
        invitation_code:
          type: string
        name:
          type: string
        pwd:
          type: string
      required:
      - email
      - invitation_code
      - pwd
      type: object
    main.TokenPair:
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
      type: object
    main.Trace:
      properties:
        attributes:
          additionalProperties: {}
          type: object
        duration_ns:
          type: integer
        end_time_ns:
          type: integer
        events:
          items: {}
          type: array
          uniqueItems: false
        kind:
          type: string
        name:
          type: string
        parent_span_id:
          type: string
        resource:
          additionalProperties: {}
          type: object
        session_id:
          type: string
        span_id:
          type: string
        start_time_ns:
          type: integer
        status:
          additionalProperties: {}
          type: object
        trace_id:
          type: string
      type: object
    main.TracesResponse:
      properties:
        count:
          type: integer
        success:
          type: boolean
        traces:
          items:
            $ref: '#/components/schemas/main.Trace'
          type: array
          uniqueItems: false
      type: object
    main.UpdateOrgUserRoleRequest:
      properties:
        role:
          type: string
      required:
      - role
      type: object
    main.UpdateProjectUserRequest:
      properties:
        role:
          description: New project-level role
          type: string
      required:
      - role
      type: object
    main.User:
      properties:
        agent_grpc_endpoint:
          type: string
        auth_provider:
          description: e.g. "okta"
          type: string
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        org_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        permissions:
          description: Keep for fine-grained resource access
          items:
            type: string
          type: array
          uniqueItems: false
        projects:
          items:
            type: string
          type: array
          uniqueItems: false
        provider_subject:
          description: OIDC "sub" from identity provider (e.g. Okta)
          type: string
        role_assignments:
          description: Scoped roles (replaces Roles field)
          items:
            $ref: '#/components/schemas/main.RoleAssignment'
          type: array
          uniqueItems: false
        updated_at:
          type: string
      type: object
    main.UserCreateRequest:
      properties:
        org_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        pwd:
          type: string
        role_assignments:
          description: Scoped assignments required
          items:
            $ref: '#/components/schemas/main.RoleAssignment'
          type: array
          uniqueItems: false
        user_id:
          type: string
      required:
      - pwd
      - role_assignments
      - user_id
      type: object
    main.UserDTO:
      properties:
        created_at:
          type: string
        org_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        role_assignments:
          description: Scoped role assignments only
          items:
            $ref: '#/components/schemas/main.RoleAssignment'
          type: array
          uniqueItems: false
        updated_at:
          type: string
        user_id:
          type: string
      type: object
    main.UserInfo:
      properties:
        email:
          type: string
        name:
          type: string
        org_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        perms:
          items:
            type: string
          type: array
          uniqueItems: false
        role_assignments:
          items:
            $ref: '#/components/schemas/main.APIRoleAssignment'
          type: array
          uniqueItems: false
        user_id:
          type: string
      type: object
    main.UserInvitationDTO:
      properties:
        created_at:
          type: string
        expires_at:
          type: string
        id:
          type: string
        invitee_email:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        project_id:
          type: string
        role:
          type: string
        type:
          description: '"org" or "project"'
          type: string
      type: object
    main.UserInvitationListResponse:
      properties:
        invitations:
          items:
            $ref: '#/components/schemas/main.UserInvitationDTO'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    main.UserListResponse:
      properties:
        total:
          type: integer
        users:
          items:
            $ref: '#/components/schemas/main.UserDTO'
          type: array
          uniqueItems: false
      type: object
    main.UserUpdateRequest:
      properties:
        org_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        pwd:
          type: string
        role_assignments:
          description: Scoped assignments - omitted field (nil) = no change, empty
            array = clear roles
          items:
            $ref: '#/components/schemas/main.RoleAssignment'
          type: array
          uniqueItems: false
      type: object
    main.WorkspaceConfig:
      properties:
        enabled_tools:
          items:
            type: string
          type: array
          uniqueItems: false
        model:
          type: string
      type: object
    main.WorkspaceDTO:
      properties:
        aer_http_endpoint:
          type: string
        agent_card:
          $ref: '#/components/schemas/main.AgentCard'
        agent_grpc_endpoint:
          type: string
        config:
          $ref: '#/components/schemas/main.WorkspaceConfig'
        created_date:
          type: string
        current_deployment_id:
          type: string
        current_payload_ref:
          type: string
        description:
          type: string
        features:
          $ref: '#/components/schemas/main.WorkspaceFeatures'
        framework:
          type: string
        gitops:
          $ref: '#/components/schemas/main.WorkspaceGitOps'
        id:
          type: string
        name:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        subdirectory:
          type: string
        updated_date:
          type: string
        workspace_id:
          type: string
        workspace_name:
          type: string
      type: object
    main.WorkspaceFeatures:
      properties:
        guardrails:
          type: boolean
        memory:
          type: boolean
      type: object
    main.WorkspaceGitOps:
      properties:
        branch:
          type: string
        connection_ref:
          type: string
        manifest_path:
          type: string
        provider:
          type: string
        repo_url:
          type: string
      type: object
    main.WorkspaceGitOpsUpdateRequest:
      properties:
        branch:
          type: string
        connection_ref:
          type: string
        manifest_path:
          type: string
        provider:
          type: string
        repo_url:
          type: string
      type: object
    main.WorkspaceListResponse:
      properties:
        total:
          type: integer
        workspaces:
          items:
            $ref: '#/components/schemas/main.WorkspaceDTO'
          type: array
          uniqueItems: false
      type: object
    main.WorkspaceUpdateRequest:
      properties:
        agent_card:
          $ref: '#/components/schemas/main.AgentCard'
        config:
          $ref: '#/components/schemas/main.WorkspaceConfig'
        description:
          type: string
        features:
          $ref: '#/components/schemas/main.WorkspaceFeatures'
        framework:
          type: string
        gitops:
          $ref: '#/components/schemas/main.WorkspaceGitOpsUpdateRequest'
        name:
