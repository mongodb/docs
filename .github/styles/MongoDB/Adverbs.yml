extends: existence
message: "You can remove most adverbs. Use your best judgment."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/write-clear-concise-sentences-paragraphs/#use-the-necessary-words'
level: suggestion
ignorecase: true
scope: sentence
nonword: false
tokens:
  - '\b\w+ly\b'
# Words that end in -ly but aren't adverbs, or adverbs that carry meaning
# the sentence needs.
exceptions:
  - anomaly
  - apply
  - assembly
  - bully
  - comply
  - costly
  - daily
  - early
  - family
  - fly
  - friendly
  - hourly
  - Italy
  - July
  - likely
  - monthly
  - multiply
  - only
  - poly
  - quarterly
  - rely
  - reply
  - supply
  - ugly
  - unlikely
  - weekly
  - yearly
