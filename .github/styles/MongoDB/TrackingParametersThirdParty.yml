extends: existence
message: "Remove the tracking parameter '%s' unless the partner requires it."
link: https://www.mongodb.com/docs/meta/style-guide/style/links-and-cross-references/
level: suggestion
scope: raw
nonword: true
# Partner links sometimes require UTM parameters, so this is a suggestion.
tokens:
  - '(?<=https?://(?!(?:www\.)?mongodb\.com)[^\s<>`]*)[?&]utm_[a-z]+=[^&\s<>`]*'
