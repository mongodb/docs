extends: existence
message: "Lowercase articles, conjunctions, and short prepositions in the middle of the heading '%s'."
link: https://www.mongodb.com/docs/meta/style-guide/style/titles-and-headings/#guidelines-for-headline-style-capitalization
level: warning
scope: heading
# Articles, coordinating conjunctions, and short prepositions only. Longer
# prepositions such as "Up", "On", and "Through" are often part of a verb
# phrase ("Set Up", "Turn On"), which the style guide capitalizes. Skips the
# first word, the word after a colon, the last word, and hyphenated
# compounds ("Per-Database"). Matches the whole heading so that Vale reports
# the heading's line, not an earlier line that contains the same word.
raw:
  - '^(?=.*?(?<=\S )(?<!: )(?:A|An|The|And|But|Nor|Or|Of|To|For|With|From|By|At|As|Into|Via|Per|Vs)\b(?!-)(?! *$)).+$'
