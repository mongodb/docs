extends: substitution
message: "Use '%s' instead of '%s' when referring to versions."
link: https://www.mongodb.com/docs/meta/style-guide/style/product-names-version-numbers/
level: error
ignorecase: false
nonword: true
scope: raw
# Each pattern requires version context immediately before the phrase: a
# dotted version number, a "v"-prefixed number, the word "version" or
# "release" followed by an optional run of numbers and punctuation, or a
# named platform followed by a version number.
#
# "higher", "lower", "newer", and "older" are correct outside version
# comparisons -- role hierarchies ("Project Owner or higher role"), cluster
# tiers ("M10 or higher"), log levels ("severity of Error or higher"),
# sizes ("128 and higher"), "upper or lower case", and "age 65 or older" --
# and Vale's regex engine (Go RE2) has no lookbehind, so the rule matches
# version context positively rather than excluding those cases. To extend
# coverage to a product whose versions are bare integers ("Xcode 11 or
# newer"), add its name to the platform alternation.
#
# "scope: raw" is required, not incidental. Without it Vale masks rST inline
# literals as asterisks before the rule runs, which hides the version in
# "``5.0`` or higher" and makes it indistinguishable from the cluster tier
# in "``M10`` or higher". Raw scope also exposes code blocks, so a version
# string in sample output can be flagged; suppress those individually.
#
# Vale rejects "(" even inside a character class, so every group here must
# be non-capturing and no character class may contain parentheses.
swap:
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+or higher': 'or later'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+and higher': 'and later'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+or lower': 'or earlier'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+and lower': 'and earlier'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+or older': 'or earlier'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+and older': 'and earlier'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+or newer': 'or later'
  '(?:\bv?\d+\.[\d.x]*|\bv\d+|[Vv]ersions?[\d\s*`,.v-]*|[Rr]eleases?[\d\s*`,.v-]*|\b(?:iOS|macOS|MacOS|Android|Windows|Node\.js|Java|JDK|JRE|Python|Ubuntu|Debian|RHEL|Xcode|Oracle|PostgreSQL|MySQL|Sybase ASE|SQL Server|C\+\+|API [Ll]evel|Update)[\s-]*\d+[a-z]?)[`),"\s]+and newer': 'and later'
