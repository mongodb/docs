<svg width="560px" height="660px" viewBox="0 0 560 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- External MongoDB Cluster (top, outside K8s) -->
  <rect x="30" y="20" width="500" height="150" rx="12" fill="#E3F5ED" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="50" y="10" width="210" height="24" rx="6" fill="#00684A"/>
  <text x="155" y="22" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">External MongoDB Cluster</text>

  <!-- shard-0 (center 195) -->
  <rect x="130" y="60" width="130" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="195" y="79" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">shard-0</text>
  <text x="195" y="98" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">ReplicaSet</text>

  <!-- shard-1 (center 365) -->
  <rect x="300" y="60" width="130" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="365" y="79" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">shard-1</text>
  <text x="365" y="98" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">ReplicaSet</text>

  <!-- External label, centered under the shards -->
  <text x="280" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">(Your external mongod instances)</text>

  <!-- Arrows from shards straight down to the "Expose envoy proxy externally" tab (on cluster border) -->
  <line x1="195" y1="116" x2="195" y2="217" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="365" y1="116" x2="365" y2="217" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="385" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">TLS</text>

  <!-- Kubernetes Cluster (bottom container) -->
  <rect x="30" y="230" width="500" height="395" rx="16" fill="none" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="187.5" y="613" width="185" height="24" rx="6" fill="#00684A"/>
  <text x="280" y="625" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Kubernetes Cluster</text>

  <!-- "Expose envoy proxy externally" tab on the cluster's top border -->
  <rect x="150" y="218" width="260" height="24" rx="6" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="280" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#001E2B">Expose envoy proxy externally</text>

  <!-- Arrow from the expose tab down to Envoy -->
  <line x1="280" y1="242" x2="280" y2="323" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="292" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">TLS, port 27028</text>

  <!-- Envoy Proxy box -->
  <rect x="90" y="324" width="380" height="120" rx="10" fill="#001E2B" stroke="#00ED64" stroke-width="1.5"/>
  <text x="280" y="348" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00ED64">Envoy Proxy</text>
  <text x="280" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9BCFC3">(operator-managed)</text>
  <circle cx="118" cy="386" r="3" fill="#00ED64"/>
  <text x="130" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">Listens on port 27028</text>
  <circle cx="118" cy="406" r="3" fill="#00ED64"/>
  <text x="130" y="410" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">TLS (SNI-based routing) to the matching shard</text>
  <circle cx="118" cy="426" r="3" fill="#00ED64"/>
  <text x="130" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">mTLS to mongot backends</text>

  <!-- Arrows from Envoy to mongot pods -->
  <line x1="195" y1="444" x2="195" y2="512" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="365" y1="444" x2="365" y2="512" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mongot-shard-0 -->
  <rect x="112" y="513" width="166" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="195" y="536" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-search-shard-0</text>
  <text x="195" y="556" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">mongot StatefulSet</text>

  <!-- mongot-shard-1 -->
  <rect x="282" y="513" width="166" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="365" y="536" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-search-shard-1</text>
  <text x="365" y="556" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">mongot StatefulSet</text>

  <!-- one per shard note -->
  <text x="280" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">One mongot StatefulSet per shard.</text>

  <!-- MongoDB leaf logo -->
  <g transform="translate(492, 32)">
    <path d="M10 0 C10 0, 18 8, 18 16 C18 24, 10 28, 10 28 C10 28, 2 24, 2 16 C2 8, 10 0, 10 0Z" fill="#00ED64"/>
    <line x1="10" y1="14" x2="10" y2="30" stroke="#00684A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
