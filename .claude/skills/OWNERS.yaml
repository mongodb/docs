agents:
  - name: atlas-release-notes
    path: .claude/agents/atlas-release-notes
    readme_description: "Generates the monthly Atlas changelog by pulling features from Aha! and Jira, writing RST entries, and updating the changelog file"
    dris:
      - jwilliams-mongo
    last_reviewed: 2026-09-15
    review_cadence_days: 30

  - name: feature-planner-agent
    path: .claude/agents/feature-planner-agent.md
    readme_description: "Turns an approved documentation plan into tasks and delegates drafting to feature-drafter-agent sub-agents"
    dris:
      - erabil-mdb
    last_reviewed: 2026-10-28
    review_cadence_days: 30

  - name: feature-drafter-agent
    path: .claude/agents/feature-drafter-agent.md
    readme_description: "Drafts one page or section from a planner task and opens a PR against the feature branch"
    dris:
      - erabil-mdb
    last_reviewed: 2026-10-28
    review_cadence_days: 30

  - name: mongot-release-notes
    path: .claude/agents/mongot-release-notes
    readme_description: "Drafts mongot release notes for the self-managed Search docs and the Atlas Search and Vector Search changelog"
    dris:
      - kanchana-mongodb
    last_reviewed: 2026-09-24
    review_cadence_days: 30

# Helper scripts the agents call (.claude/scripts/).
scripts:
