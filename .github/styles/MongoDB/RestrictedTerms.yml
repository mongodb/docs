extends: existence
message: "Verify your usage of '%s' with the Alphabetical List of Terms in the style guide."
link: 'https://www.mongodb.com/docs/meta/style-guide/terminology/alphabetical-terms/'
level: suggestion
ignorecase: true
nonword: true
# Each pattern matches the specific misuse that the term's glossary entry
# describes, not every occurrence of the word. Most restricted terms, such as
# "following", "default", and "either", are correct in most contexts, so
# flagging the bare word buries the real findings.
tokens:
  # about: Don't use "on" to mean "about" or "about" to mean "approximately".
  - '\b(?:information|details|guidance|feedback|tutorial|guide|article|documentation)\s+on\b'
  - '\babout\s+\d'
  # above, below: Don't use them to locate information in a topic.
  - '\b(?:shown|described|listed|mentioned|noted|see|seen)\s+(?:above|below)\b'
  - '\bthe\s+(?:above|below)\b'
  # allow, lets, permit: Use "you can" unless the topic is permission.
  - '\b(?:allows?|lets|permits?)\s+(?:you|users|customers)\s+to\b'
  - '\blets?\s+(?:you|users|customers)\b'
  # assure, insure: Use "ensure".
  - '\b(?:assure|insure)[sd]?\b'
  # check: Don't use it as a verb. Tell users to select or clear a check box,
  # and prefer "verify".
  - '\bcheck\s+the\s+(?:check\s+)?box\b'
  - '\bcheck\s+(?:that|whether|if|the|your|for)\b(?!\s+box)'
  # compliment: Use "complement" for an item that completes another.
  - '\bcompliment(?:s|ed|ing|ary)?\b'
  # default: Don't use it as a verb.
  - '\bdefault(?:s|ed)?\s+to\b'
  # dialog: Use "dialog box".
  - '\bdialog\b(?!\s+box)'
  # do: Don't use it in phrases such as "do the following".
  - '\bdo\s+the\s+following\b'
  # following, preceding: Use them as adjectives, not as nouns.
  - '\bthe\s+(?:following|preceding)[.:;,)]'
  # given: Don't use it to mean "particular" or "specific".
  - '\b(?:a|any|each|the)\s+given\b'
  # grayed, grayed out: Use "dimmed" or "unavailable".
  - '\bgrayed(?:\s+out)?\b'
  # impact: Don't use it as a verb. Use "affect".
  - '\b(?:can|could|may|might|will|would|to|not|directly|negatively|positively|significantly)\s+impact\b'
  - '\bimpact(?:ed|ing)\b'
  # interface: Don't use it as a verb. Use "interact".
  - '\binterfac(?:e|es|ed|ing)\s+with\b'
  # leverage: Use "use" in technical content.
  - '\bleverag(?:e|es|ed|ing)\b'
  # log in, login: Use "log in" as the verb and "login" as the noun.
  - '\blogin\s+(?:to|with|as)\b'
  # machine: Use it only for a virtual machine.
  - '(?<!virtual\s+)\bmachines?\b'
  # man: Use it only for man pages or the man command.
  - '\bman\b(?!\s+pages?|\s+command)'
  # menu item: Use "command".
  - '\bmenu\s+items?\b'
  # mouse: Don't use it as a verb.
  - '\bmouse[- ]?over\b'
  # PC: Use "computer".
  - '(?-i)\bPCs?\b'
  # please: Don't use it in instructions.
  - '\bplease\b'
