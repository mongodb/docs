# .github/workflows/bump-preview.yml
name: Create Bump.sh preview

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: bump-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Create API preview on Bump.sh
    if: >-
      github.event.label.name == 'eras-openapi' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create Bump.sh preview
        id: bump
        uses: bump-sh/github-action@3cfa0288007867bad2515ca467cc01d8291a3301
        with:
          doc: ${{ vars.ERAS_BUMP_DOC_ID }}
          token: ${{ secrets.ERAS_BUMP_TOKEN }}
          file: content/voyageai/source/openapi/atlas-embedding-and-reranking-api-openapi-source.yaml
          branch: main
          command: preview

  comment:
    name: Post preview link to PR
    needs: preview
    runs-on: ubuntu-latest

    steps:
      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- bump-preview -->';
            const pr = context.payload.pull_request;

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const job = jobs.data.jobs
              .filter(j => j.name === 'Create API preview on Bump.sh')
              .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];
            let previewUrl = '';
            if (job) {
              const logsResp = await github.request(
                'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id
                }
              );
              const match = logsResp.data.match(
                /Your preview is visible at:\s*(.*)/
              );
              if (match) previewUrl = match[1].trim();
            }

            const body = [
              marker,
              '### ERAS API reference preview',
              '',
              `Preview generated from commit \`${pr.head.sha.slice(0, 7)}\`.`,
              '',
              previewUrl
                ? `[View ERAS API reference preview](${previewUrl})`
                : 'No preview URL found in the workflow logs.',
              '',
              'Apply the `eras-openapi` label again after making further changes.'
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100
              }
            );

            const existing = comments.find(
              comment =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }