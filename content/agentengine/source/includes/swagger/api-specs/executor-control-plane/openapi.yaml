  /api/v1/projects/{project_id}:
    delete:
      description: Called by the api-gateway after gating on "no active workspaces
        in this project". Re-checks the invariant in ECP (defense-in-depth) and calls
        AO DeleteTenantEnvironment with bounded retry on FailedPrecondition.
      parameters:
      - description: Project ID (must equal X-Project-ID header)
        in: path
        name: project_id
        required: true
        schema:
          type: string
      - description: Org ID (ObjectID hex)
        in: header
        name: X-Org-ID
        required: true
        schema:
          type: string
      - description: Project ID (ObjectID hex, must equal :project_id)
        in: header
        name: X-Project-ID
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: string
          description: No Content — TE deleted or was already absent
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Malformed header IDs, invalid path ObjectID, or path/header
            project_id mismatch
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Missing X-Org-ID or X-Project-ID header
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: PROJECT_HAS_ACTIVE_WORKSPACES — ECP's defense-in-depth count
            check found active workspaces; api-gateway gate was bypassed
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: TEARDOWN_FAILED — AO DeleteTenantEnvironment returned a non-NotFound
            non-FailedPrecondition error, or retry exhaustion on FailedPrecondition
      summary: Tear down a project's TenantEnvironment
      tags:
      - Projects
