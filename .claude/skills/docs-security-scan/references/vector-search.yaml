# Security-scan manifest for the Atlas Vector Search (vector-search) docset.
# Conforms to references/SCHEMA.md.

docset: vector-search
# Verified DOCSP Jira components (DOCSP-65938, DOCSP-66033).
component:
  - "Atlas Vector Search"

docs:
  path: content/vector-search

security_considerations:

  - id: vector-search-multi-tenant-query-must-filter-tenant-id
    # Grounded in deployment/multi-tenant-architecture.txt.
    rule: >-
      Examples and prose that run $vectorSearch against a shared multi-tenant
      collection must pre-filter on the tenant identifier (tenant_id).
      Prose must not claim tenant isolation without that query filter.
    applies_to: ["multi-tenant", "deployment"]
    category: counter_best_practice_advice
    severity: High

  # Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # Taken from callouts in the built vector-search AST.
  - directive: note
    phrases:
      # IDE setup note on pages that set API keys inline (e.g. about/vector-quantization.txt, tutorials/rag.txt).
      - "manage environment variables through a deployment configuration"
      # Shared include includes/deployment/procedures/on-prem-quick-start-avs-*.rst.
      - "resulting set up of this quick start is not secure"
      # tutorials/local-rag.txt Local Atlas deployment note.
      - "intended for testing only"

validation:
  known_intentional:
    - page: about/vector-quantization.txt
      pattern: >-
        The Python embedding example that sets the API key inline with
        os.environ["VOYAGE_API_KEY"] = "<VOYAGEAI-API-KEY>".
      caveat: >-
        Same-page `.. note::` — "This example sets the variables for the
        project in the IDE. Production applications might manage environment
        variables through a deployment configuration, CI/CD pipeline, or
        secrets manager, but you can adapt the provided code to fit your use
        case."
