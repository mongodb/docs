# Security-scan manifest for the mongosh (mongodb-shell) docset. Conforms to
# references/SCHEMA.md.

docset: mongodb-shell
# Verified against recent mongosh DOCSP tickets (DOCSP-65923, DOCSP-65908).
component:
  - "mongosh"

docs:
  path: content/mongodb-shell

security_considerations: []

# Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # Taken from callouts in the built mongosh AST, including docs-shared dbx/json-bson-injection-warning.rst.
  - directive: warning
    phrases:
      - "an attacker can inject operators"
      - "validating input before conversion"
      - "avoid using the --tlsAllowInvalidCertificates"
      - "systems where intrusion is not possible"

validation:
  known_intentional:
    - page: reference/ejson/parse.txt
      pattern: >-
        EJSON.parse() JSON-to-BSON conversion examples.
      caveat: >-
        Page carries the shared json-bson-injection-warning callout — "an
        attacker can inject operators or unexpected field values ... This risk
        is greatest when the JSON originates from a user, an API request, or
        another untrusted source"; examples use static literals, not untrusted
        input.
    - page: reference/ejson/deserialize.txt
      pattern: >-
        EJSON.deserialize() JSON-to-BSON conversion examples.
      caveat: >-
        Same shared json-bson-injection-warning callout; examples use static
        literals, not untrusted input.
    - page: reference/options.txt
      pattern: >-
        The --tlsAllowInvalidCertificates option description (prose, no
        code example) explaining that the shell does not validate server
        certificates when it is set.
      caveat: >-
        Same-page `.. warning::` — "Although available, avoid using the
        --tlsAllowInvalidCertificates option if possible ... only use the
        option on systems where intrusion is not possible" and "creates a
        vulnerability to expired mongod and mongos certificates".
