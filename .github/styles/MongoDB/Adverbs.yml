extends: existence
message: "You can remove most adverbs. Use your best judgment."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/write-clear-concise-sentences-paragraphs/#use-the-necessary-words'
level: suggestion
ignorecase: true
scope: sentence
nonword: false
# Words that end in -ly but aren't adverbs, or adverbs that carry meaning the
# sentence needs. A lookahead rather than the exceptions list, which Vale
# matches case-sensitively even with ignorecase on, so "Only" was flagged.
raw:
  - '\b(?!anomaly\b|apply\b|assembly\b|bully\b|comply\b|costly\b|daily\b|early\b|family\b|fly\b|friendly\b|hourly\b|italy\b|july\b|likely\b|monthly\b|multiply\b|only\b|poly\b|quarterly\b|rely\b|reply\b|supply\b|ugly\b|unlikely\b|weekly\b|yearly\b)\w+ly\b'
