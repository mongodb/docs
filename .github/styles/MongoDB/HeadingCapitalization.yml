extends: existence
message: "Capitalize pronouns, determiners, and forms of 'be' in the heading '%s'."
link: https://www.mongodb.com/docs/meta/style-guide/style/titles-and-headings/#guidelines-for-headline-style-capitalization
level: warning
scope: heading
# Pronouns, determiners, and forms of "be" are never minor words in AP
# headline style, so a lowercase one is always an error. Skips headings that
# start with a lowercase literal ("atlas auth login"), question headings,
# and method or command headings that contain "()". Matches the whole
# heading so that Vale reports the heading's line, not an earlier line that
# contains the same word.
raw:
  - '^[A-Z](?=[^?(]*\s(?:your|you|this|that|these|those|all|no|is|are|be|was|were|it|its|our|my|their)\b)[^?(]*$'
