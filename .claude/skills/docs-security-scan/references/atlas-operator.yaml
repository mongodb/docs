# Security-scan manifest for the Atlas Kubernetes Operator (AKO) docset.
# Conforms to references/SCHEMA.md.

docset: atlas-operator
# Verified DOCSP Jira components (DOCSP-65810).
component:
  - "Kubernetes Atlas"

docs:
  path: content/atlas-operator/upcoming

security_considerations:

  - id: atlas-operator-single-tenant-installation
    # Grounded in the multi-tenant warning in ak8so-quick-start.txt.
    rule: >-
      Prose and examples must not recommend or imply sharing a single Atlas
      Kubernetes Operator installation across multiple tenants, even in
      different namespaces: tenants that share an operator can use
      cross-namespace references to access resources in other namespaces,
      including secrets. Multi-tenant use requires a separate operator
      installation per tenant.
    applies_to: ["quick-start", "production", "install"]
    category: counter_best_practice_advice
    severity: High

  - id: atlas-operator-ip-access-list-least-privilege
    # Grounded in ak8so-alert-configurations.txt, ak8so-configure-audit-logs.txt, and atlasproject-custom-resource.txt.
    rule: >-
      projectIpAccessList examples must not grant access from the entire
      internet (0.0.0.0/0, or paired /1 blocks that together cover it)
      unless the example is explicitly labeled as a test-only
      configuration; production-facing examples should list the narrowest
      CIDR blocks or IP addresses required.
    applies_to: ["project", "quick-start", "ip-access-list"]
    category: insecure_code_example
    severity: High

  - id: atlas-operator-api-key-role-least-privilege
    # Grounded in includes/fact-ak8so-api-key-permission.rst.
    rule: >-
      Prose and examples that configure the Atlas Kubernetes Operator's
      connection secret should assign the API key or service account the
      minimum Atlas role the workflow requires — Project Owner for existing
      projects, Organization Project Creator when the operator creates new
      projects — not a broader organization-level role, unless the context
      justifies it. Extends universal U-5 to Atlas API key and service
      account roles, which U-5's database-user scope does not cover.
    applies_to: ["quick-start", "service-accounts", "secret-storage", "configure"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

# No exception markers: the "For test purposes only" labels are code comments, not callouts.
exception_markers: []
