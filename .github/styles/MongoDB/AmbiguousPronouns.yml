extends: existence
message: "Avoid starting a sentence with the ambiguous pronoun '%s'. Identify the specific subject."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-pronouns-carefully/'
level: suggestion
scope: sentence
# Match only when a verb follows the pronoun ("This causes an error"). The
# style guide allows "This" followed by a noun ("This option causes an
# error"), so a bare '^(This|That)\b' flags the guide's own correct example.
raw:
  - '^(?:This|That)(?=\s+(?:is|are|was|were|means|causes|allows|lets|enables|ensures|prevents|makes|can|could|will|would|should|may|might|must|does|has|requires|results|happens|occurs|helps|also|improves|reduces|increases|creates|returns|gives|provides|applies|works)\b)'
