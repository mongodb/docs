<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Atlas compute and storage (MongoDB colors)</title>
<desc>A compute-and-storage view of Atlas in MongoDB green palette on a white background. A Compute layer panel, labeled with a bright green Compute pill, holds two nodes, Primary and Standby, and is described as queries, transactions, aggregations and highly available. It connects to a single opaque Storage layer box in Forest Green, labeled with a bright green Storage pill, described only by customer guarantees: Secure, Durable and Highly Available.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3D4F58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="720" height="320" fill="#FFFFFF"/>

<!-- Compute layer panel -->
<rect x="60" y="50" width="600" height="122" rx="12" fill="#F9FBFA" stroke="#C1C7C6" stroke-width="1"/>
<rect x="312" y="37" width="96" height="26" rx="13" fill="#00ED64"/><text x="360" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Compute</text>
<text x="360" y="82" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5C6C75">Queries, transactions, aggregations. Secure. Highly available.</text>
<rect x="198" y="104" width="140" height="50" rx="8" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="268" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">Primary</text>
<rect x="382" y="104" width="140" height="50" rx="8" fill="#E3FCF7" stroke="#00684A" stroke-width="1"/><text x="452" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#023430">Standby</text>

<!-- connects to (two one-way arrows) -->
<line x1="352" y1="176" x2="352" y2="195" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="368" y1="195" x2="368" y2="176" stroke="#3D4F58" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="384" y="186" text-anchor="start" dominant-baseline="central" font-size="11" font-style="italic" fill="#5C6C75">connects to</text>

<!-- Storage layer = single opaque box, guarantees only -->
<rect x="60" y="212" width="600" height="90" rx="12" fill="#00684A" stroke="#00A35C" stroke-width="1.5"/>
<rect x="312" y="199" width="96" height="26" rx="13" fill="#00ED64"/><text x="360" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#001E2B">Storage</text>
<text x="360" y="250" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" letter-spacing="0.5" fill="#71F6BA">Secure &#183; Durable &#183; Highly Available</text>
<text x="360" y="276" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#C0FAE6">Managed by Atlas</text>
</svg>
