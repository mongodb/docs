   - MongoDB 8.1
   - MongoDB 8.0
   - MongoDB 7.0
   - MongoDB 6.0
   - MongoDB 5.0
   - MongoDB 4.4
   - MongoDB 4.2

   |tool-binary| does not support MongoDB Server versions earlier than
   4.2. Attempts to connect to an earlier Server version fail.
