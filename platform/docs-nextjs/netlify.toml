# For handling Kanopy routing distinction between mongodb.com and products/updates _next/static request we needed to use 
# assetPrefix to move products/updates _next/static under /docs allowing for request coming from Kanopy to be handled by B2k and NextJs
# This redirect handles NextJs assuming _next/static to be under docs but when deployed in to our CDN the static folder sits at the root
# See EPIC below for more context
# https://jira.mongodb.org/browse/DOP-6064

[build.environment]
SECRETS_SCAN_ENABLED = "false"
NEXTJS_EXTENSION_ENABLED = "true"
NEXTJS_EXTENSION_ENABLED_STAGING = "false"
NEXTJS_EXTENSION_ENABLED_STAGING_2 = "false"

[context.production.environment]
    ENV = "dotcomprd"

[context.preprd.environment]
    ENV = "dotcomstg"

[context.deploy-preview.environment]
    ENV = "prd"

[context.branch-deploy.environment]
    ENV = "prd"

[context.preview-server.environment]
    ENV = "prd"

[context.dev.environment]
    ENV = "stg"

[[redirects]]
from = "/docs/docs_static_nextjs/_next/*"
to = "/_next/:splat"
status = 200

[dev]
framework = "next"
command = "next dev"
publish = ".next"

[build]
# Literal multiline TOML (''') so shell "$VARS" and node -e '...' quoting stay valid.
# Mints CodeArtifact auth when NPM_AWS_KEY is set (e.g. Deploy Previews); otherwise skips.
command = '''
set -euo pipefail
if [ -n "${NPM_AWS_KEY:-}" ]; then
  export AWS_ACCESS_KEY_ID="$NPM_AWS_KEY"
  export AWS_SECRET_ACCESS_KEY="$NPM_AWS_SECRET"
  export AWS_DEFAULT_REGION=us-east-1
  AUTH_DIR=$(mktemp -d)
  npm install --prefix "$AUTH_DIR" --silent @aws-sdk/client-codeartifact@3
  NPM_AWS_AUTH="$(NODE_PATH="$AUTH_DIR/node_modules" node -e 'const { CodeartifactClient, GetAuthorizationTokenCommand } = require("@aws-sdk/client-codeartifact"); (async () => { const client = new CodeartifactClient({ region: "us-east-1" }); const out = await client.send(new GetAuthorizationTokenCommand({ domain: "mongodb", domainOwner: "271346171620" })); if (!out.authorizationToken) throw new Error("empty CodeArtifact token"); process.stdout.write(out.authorizationToken); })().catch((e) => { console.error(e); process.exit(1); });')"
  export NPM_AWS_AUTH
  [ -n "$NPM_AWS_AUTH" ] || { echo "CodeArtifact token fetch returned empty"; exit 1; }
  echo "NPM_AWS_AUTH length=${#NPM_AWS_AUTH}"
fi
cd platform/docs-nextjs
pnpm install --filter='!docs-comparison'
pnpm run build
'''