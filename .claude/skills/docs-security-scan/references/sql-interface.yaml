# Security-scan manifest for the SQL Interface docset. Conforms to
# references/SCHEMA.md.

docset: sql-interface
# Verified DOCSP Jira components (DOCSP-64971).
component:
  - "SQL Interface"

docs:
  path: content/sql-interface

# No environment-variable idiom: JDBC URLs, ODBC DSNs, and UI fields carry credentials directly.
disable_universal: [U-7]

security_considerations:

  - id: sql-interface-no-inline-credentials-in-driver-config
    # Grounded in authentication.txt and includes/fact-system-user-odbc-config.rst.
    rule: >-
      Examples that configure a JDBC or ODBC connection must not show real
      credentials inline — a user:password@ pair in a JDBC URL or connection
      URI, or a plaintext Password entry in an ODBC DSN configuration file.
      Placeholder credentials (e.g. your_password, <db_password>) or the
      docset's documented alternatives (credential files, secure credential
      management) are acceptable.
    category: insecure_code_example
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

# No exception markers: no callout in the built AST caveats an insecure example.

validation: {}
