# Security-scan manifest for the mongosync (Cluster-to-Cluster Sync) docset.
# Conforms to references/SCHEMA.md.

docset: mongosync
# Canonical mongosync component per triage/references/server.md; verified on DOCSP-65986.
component:
  - "C2C"

docs:
  path: content/mongosync/current

# No environment-variable idiom for connection strings in this docset.
disable_universal: [U-7]

security_considerations:

  - id: mongosync-connection-string-password-on-command-line
    # Grounded in includes/warn-option-cluster-password-visibility.rst.
    rule: >-
      Examples that pass a password in the --cluster0 or --cluster1
      connection strings on the command line should carry an adjoining
      caveat that the password may be visible to system status programs
      such as ps, or point to the --config configuration file as the safer
      alternative. Prose must not recommend credentialed connection strings
      on the command line without that caveat. Extends universal U-7 to
      mongosync's CLI, which has no environment-variable idiom.
    applies_to: ["quickstart", "connecting", "reference"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # Taken from callouts in the built mongosync AST.
  - directive: warning
    phrases:
      - "visible to system status programs"
      - "configuration file containing the password"

validation:
  known_intentional: []
