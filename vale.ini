StylesPath = .github/styles
MinAlertLevel = warning

[formats]
txt = rst

[*.{rst,txt}]
BasedOnStyles = MongoDB
# Skip release-note entries that copy a Jira issue title verbatim.
BlockIgnores = (?m)^[ \t]*[-*] :issue:`[^`]+`.*(?:\n[ \t][ \t]+[^-*\s].*)*

