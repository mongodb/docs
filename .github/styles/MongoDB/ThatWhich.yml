extends: existence
message: "If this is a restrictive clause, use 'that' instead of 'which'. If it's nonrestrictive, add a comma before 'which'."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-that-which-correctly/'
level: suggestion
ignorecase: true
nonword: true
# A "which" directly after a word, with no comma, is either a restrictive
# clause that needs "that" or a nonrestrictive clause missing its comma. A
# preposition before "which" ("in which", "on which") and an interrogative
# "which" after a verb ("select which", "determine which") are correct, so
# they're excluded.
tokens:
  - '\b(?!(?:about|across|after|against|along|among|around|at|before|behind|below|beneath|beside|between|by|during|for|from|in|inside|into|of|on|onto|over|through|to|toward|under|upon|with|within|without|choose|chooses|decide|decides|determine|determines|identify|identifies|indicate|indicates|know|learn|see|select|selects|show|shows|specify|specifies|tell|tells|verify|check|checks|controls|control|define|defines|and|or|but|regardless|of)\b)[a-z]+\s+which\b'
