ref: filter-equality
content: |

   .. selected-content::
      :selections: mongosh, None

      To specify equality conditions, use ``<field>:<value>``
      expressions in the
      :ref:`query filter document <document-query-filter>`:

      .. code-block:: javascript

         { <field1>: <value1>, ... }

   .. selected-content::
      :selections: compass, None

      To specify equality conditions, use ``<field>:<value>``
      expressions in the
      :ref:`query filter document <document-query-filter>`:

      .. code-block:: javascript

         { <field1>: <value1>, ... }

