    get:
      description: Returns merged trace spans and execution logs for a session, thread,
        or execution.
      parameters:
      - description: Session ID filter
        in: query
        name: session_id
        schema:
          type: string
      - description: Thread ID filter
        in: query
        name: thread_id
        schema:
          type: string
      - description: Execution ID filter
        in: query
        name: execution_id
        schema:
          type: string
      - description: Span kind filter. Applied post-fetch after the per-collection
          1000-doc retrieval cap, so high-volume sessions may not surface every matching
          span.
