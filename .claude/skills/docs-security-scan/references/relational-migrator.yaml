# Security-scan manifest for the Relational Migrator docset. Conforms to
# references/SCHEMA.md.

docset: relational-migrator
# Verified against DOCSP-64303.
component:
  - "migrator"

docs:
  path: content/relational-migrator

# Credentials are pasted into the UI or user.properties; no env-var idiom.
disable_universal: [U-7]

security_considerations:

  - id: rm-rest-api-remote-access-unauthenticated
    # Grounded in the api-docs.txt warning and the external-access
    # guidance on installation/install-on-an-unattended-server.txt.
    rule: >-
      Prose and procedures that enable remote or external access to the
      Relational Migrator REST API or web application (unattended server
      installation, external access) must carry the caveat that the REST
      API does not support authentication; prose must not recommend
      enabling remote access without that caveat.
    applies_to: ["api-docs", "installation", "unattended"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # Taken from callouts in the built Relational Migrator AST.
  - directive: warning
    phrases:
      - "does not support authentication"
  - directive: note
    phrases:
      - "not recommended for production workloads"
  - directive: important
    phrases:
      - "review the script with a database administrator"

validation:
  known_intentional:
    - page: installation/install-with-docker.txt
      pattern: >-
        docker run examples that publish the Migrator port (8080) with no
        TLS or authentication configuration, for local evaluation.
      caveat: >-
        Same-page `.. note::` — "This deployment method is intended as an
        easy way to evaluate Relational Migrator and is not recommended
        for production workloads."
