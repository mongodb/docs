<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" role="img" aria-labelledby="diagramTitle">
  <title id="diagramTitle">Expressions, accumulators, and window functions compared by how each maps input documents to output values</title>
  <rect width="1040" height="310" fill="#ffffff"/>
  <defs>
    <marker id="ah1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#00684a"/></marker>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2d5f8b"/></marker>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8a5a00"/></marker>
    <marker id="ah4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7a3fa0"/></marker>
  </defs>

  <style>
    .title   { font-family: 'Euclid Circular A', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #001e2b; }
    .header  { font-family: 'Euclid Circular A', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #00684a; }
    .card    { font-family: 'Euclid Circular A', Helvetica, Arial, sans-serif; font-size: 11px; fill: #001e2b; }
    .caption { font-family: 'Euclid Circular A', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #001e2b; }
    .glabel  { font-family: 'Euclid Circular A', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
    .card1   { fill: #e3fcf7; stroke: #00684a; stroke-width: 1.2; }
    .card2   { fill: #e8f1fb; stroke: #2d5f8b; stroke-width: 1.2; }
    .card3   { fill: #fdf2dd; stroke: #8a5a00; stroke-width: 1.2; }
    .card4   { fill: #f4ecfb; stroke: #7a3fa0; stroke-width: 1.2; }
    .plain   { fill: #ffffff; stroke: #001e2b; stroke-width: 1; }
    .gbrk1   { fill: none; stroke: #00684a; stroke-width: 1.5; }
    .gbrk2   { fill: none; stroke: #2d5f8b; stroke-width: 1.5; }
    .lbl1    { fill: #00684a; }
    .lbl2    { fill: #2d5f8b; }
    .lbl3    { fill: #8a5a00; }
    .lbl4    { fill: #7a3fa0; }
  </style>

  <!-- ================= Panel 1: Expression ================= -->
  <text class="title"  x="170" y="30" text-anchor="middle">Expression</text>
  <text class="header" x="80"  y="52" text-anchor="middle">Input documents</text>
  <text class="header" x="233" y="52" text-anchor="middle">Output</text>

  <rect class="card1" x="25" y="78"  width="110" height="22" rx="4"/>
  <text class="card"  x="35" y="93">doc</text>
  <rect class="card2" x="25" y="106" width="110" height="22" rx="4"/>
  <text class="card"  x="35" y="121">doc</text>
  <rect class="card3" x="25" y="134" width="110" height="22" rx="4"/>
  <text class="card"  x="35" y="149">doc</text>
  <rect class="card4" x="25" y="162" width="110" height="22" rx="4"/>
  <text class="card"  x="35" y="177">doc</text>

  <path d="M141 89 L171 89"  stroke="#00684a" stroke-width="1.5" fill="none" marker-end="url(#ah1)"/>
  <path d="M141 117 L171 117" stroke="#2d5f8b" stroke-width="1.5" fill="none" marker-end="url(#ah2)"/>
  <path d="M141 145 L171 145" stroke="#8a5a00" stroke-width="1.5" fill="none" marker-end="url(#ah3)"/>
  <path d="M141 173 L171 173" stroke="#7a3fa0" stroke-width="1.5" fill="none" marker-end="url(#ah4)"/>

  <rect class="card1" x="178" y="78"  width="110" height="22" rx="4"/>
  <text class="card"  x="188" y="93">value</text>
  <rect class="card2" x="178" y="106" width="110" height="22" rx="4"/>
  <text class="card"  x="188" y="121">value</text>
  <rect class="card3" x="178" y="134" width="110" height="22" rx="4"/>
  <text class="card"  x="188" y="149">value</text>
  <rect class="card4" x="178" y="162" width="110" height="22" rx="4"/>
  <text class="card"  x="188" y="177">value</text>

  <text class="caption" x="170" y="290" text-anchor="middle">One value per document</text>

  <!-- ================= Panel 2: Accumulator ================= -->
  <text class="title"  x="500" y="30" text-anchor="middle">Accumulator</text>
  <text class="header" x="410" y="52" text-anchor="middle">Input documents</text>
  <text class="header" x="569" y="52" text-anchor="middle">Output</text>

  <path class="gbrk1" d="M349 72 L349 162 M349 72 L357 72 M349 162 L357 162"/>
  <text class="glabel lbl1" x="344" y="121" text-anchor="end">G1</text>
  <rect class="card1" x="361" y="78"  width="110" height="22" rx="4"/>
  <text class="card"  x="371" y="93">doc</text>
  <rect class="card1" x="361" y="106" width="110" height="22" rx="4"/>
  <text class="card"  x="371" y="121">doc</text>
  <rect class="card1" x="361" y="134" width="110" height="22" rx="4"/>
  <text class="card"  x="371" y="149">doc</text>

  <path class="gbrk2" d="M349 170 L349 260 M349 170 L357 170 M349 260 L357 260"/>
  <text class="glabel lbl2" x="344" y="219" text-anchor="end">G2</text>
  <rect class="card2" x="361" y="176" width="110" height="22" rx="4"/>
  <text class="card"  x="371" y="191">doc</text>
  <rect class="card2" x="361" y="204" width="110" height="22" rx="4"/>
  <text class="card"  x="371" y="219">doc</text>
  <rect class="card2" x="361" y="232" width="110" height="22" rx="4"/>
  <text class="card"  x="371" y="247">doc</text>

  <path d="M483 117 L507 117" stroke="#00684a" stroke-width="1.5" fill="none" marker-end="url(#ah1)"/>
  <path d="M483 215 L507 215" stroke="#2d5f8b" stroke-width="1.5" fill="none" marker-end="url(#ah2)"/>

  <rect class="card1" x="514" y="106" width="110" height="22" rx="4"/>
  <text class="card"  x="524" y="121">value</text>
  <rect class="card2" x="514" y="204" width="110" height="22" rx="4"/>
  <text class="card"  x="524" y="219">value</text>

  <text class="caption" x="500" y="290" text-anchor="middle">One value per group</text>

  <!-- ================= Panel 3: Window function ================= -->
  <text class="title"  x="855" y="30" text-anchor="middle">Window function</text>
  <text class="header" x="755" y="52" text-anchor="middle">Input documents</text>
  <text class="header" x="955" y="52" text-anchor="middle">Output</text>

  <rect class="plain" x="700" y="78"  width="110" height="22" rx="4"/>
  <text class="card"  x="710" y="93">doc 1</text>
  <rect class="plain" x="700" y="106" width="110" height="22" rx="4"/>
  <text class="card"  x="710" y="121">doc 2</text>
  <rect class="plain" x="700" y="134" width="110" height="22" rx="4"/>
  <text class="card"  x="710" y="149">doc 3</text>
  <rect class="plain" x="700" y="162" width="110" height="22" rx="4"/>
  <text class="card"  x="710" y="177">doc 4</text>
  <rect class="plain" x="700" y="190" width="110" height="22" rx="4"/>
  <text class="card"  x="710" y="205">doc 5</text>

  <path class="gbrk1" d="M818 78 L826 78 M818 78 L818 156 M818 156 L826 156"/>
  <text class="glabel lbl1" x="818" y="70">window for doc 2</text>
  <path class="gbrk2" d="M832 134 L840 134 M832 134 L832 212 M832 212 L840 212"/>
  <text class="glabel lbl2" x="832" y="228">window for doc 4</text>

  <path d="M826 117 L890 117" stroke="#00684a" stroke-width="1.5" fill="none" marker-end="url(#ah1)"/>
  <path d="M840 173 L890 173" stroke="#2d5f8b" stroke-width="1.5" fill="none" marker-end="url(#ah2)"/>

  <rect class="plain"  x="900" y="78"  width="110" height="22" rx="4"/>
  <text class="card"   x="910" y="93">value</text>
  <rect class="card1"  x="900" y="106" width="110" height="22" rx="4"/>
  <text class="card"   x="910" y="121">value</text>
  <rect class="plain"  x="900" y="134" width="110" height="22" rx="4"/>
  <text class="card"   x="910" y="149">value</text>
  <rect class="card2"  x="900" y="162" width="110" height="22" rx="4"/>
  <text class="card"   x="910" y="177">value</text>
  <rect class="plain"  x="900" y="190" width="110" height="22" rx="4"/>
  <text class="card"   x="910" y="205">value</text>

  <text class="caption" x="855" y="290" text-anchor="middle">One value per document, each from a window</text>
</svg>
