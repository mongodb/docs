extends: existence
message: "'%s' is passive voice. If the reader performs the action, rewrite it as an instruction."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-active-voice/'
level: suggestion
# The style guide allows passive voice when the actor is unknown or less
# important than the object, so this matches only verbs the reader usually
# performs ("The service can be restarted").
raw:
  - '(?<![Cc]annot |not )\bcan (?:also |optionally )?be (?:used|accessed|downloaded|configured|set|enabled|disabled|specified|run|installed|found|viewed|changed|modified|restarted|created|added|removed|deleted|updated|deployed|passed|called|invoked|retrieved|queried|obtained|selected|applied|managed|stored|achieved|done|seen|chosen)\b'
