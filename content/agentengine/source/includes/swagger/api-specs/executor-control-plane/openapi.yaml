components:
  schemas:
    apps.BuildConfig:
      properties:
        entrypoint:
          type: string
        name:
          type: string
        sdk_version:
          type: string
        system_packages:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    builds.BuildTarget:
      properties:
        subdirectory:
          type: string
      type: object
    builds.GitInfo:
      properties:
        branch:
          type: string
        commit_sha:
          type: string
        dirty:
          type: boolean
      type: object
    cloudwatch.LogEvent:
      properties:
        message:
          type: string
        timestamp:
          type: string
      type: object
    deploy.ComponentImages:
      properties:
        aer:
          type: string
        memory_server:
          type: string
        oe:
          type: string
        tool:
          type: string
      type: object
    ecr.ComponentValidation:
      properties:
        component:
          type: string
        error:
          type: string
        image_uri:
          type: string
        valid:
          type: boolean
      type: object
    ecr.ImageValidationResult:
      properties:
        all_valid:
          type: boolean
        components:
          items:
            $ref: '#/components/schemas/ecr.ComponentValidation'
          type: array
          uniqueItems: false
      type: object
    httpapi.AdminAppListResponse:
      properties:
        apps:
          items:
            $ref: '#/components/schemas/httpapi.AppResponse'
          type: array
          uniqueItems: false
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      type: object
    httpapi.AdminPlatformOutcomeBuckets:
      properties:
        failed:
          type: integer
        in_progress:
          type: integer
        succeeded:
          type: integer
      type: object
    httpapi.AdminPlatformStatsResponse:
      properties:
        active_workspaces:
          type: integer
        computed_at:
          type: string
        last_deployment_outcomes:
          $ref: '#/components/schemas/httpapi.AdminPlatformOutcomeBuckets'
        organizations:
          type: integer
        projects:
          type: integer
        workspaces:
          type: integer
      type: object
    httpapi.AppResponse:
      properties:
        app_id:
          type: string
        branch:
          type: string
        build_config:
          $ref: '#/components/schemas/apps.BuildConfig'
        created_at:
          type: string
        current_build_id:
          type: string
        current_deployment_id:
          type: string
        current_image_uri:
          type: string
        ecr_repository:
          type: string
        executor_type:
          description: |-
            ExecutorType is DEPRECATED — the per-app executor_type field is no
            longer the source of truth; the ap.ecp.executor_type_vm feature
            flag is. Exposed here read-only for backwards compat and telemetry
            on legacy records.
          type: string
        github_installation_id:
          type: integer
        memory_enabled:
          type: boolean
        name:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        repo_name:
          type: string
        repo_owner:
          type: string
        repo_url:
          type: string
        source_type:
          type: string
        status:
          type: string
        subdirectory:
          type: string
        updated_at:
          type: string
        warnings:
          items:
            type: string
          type: array
          uniqueItems: false
        webhook_id:
          type: integer
        workspace:
          type: string
        workspace_name:
          type: string
      type: object
    httpapi.AppsListResponse:
      properties:
        apps:
          items:
            $ref: '#/components/schemas/httpapi.AppResponse'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    httpapi.ArchiveInitBuildRequest:
      properties:
        build_target:
          $ref: '#/components/schemas/builds.BuildTarget'
        git_info:
          $ref: '#/components/schemas/builds.GitInfo'
        label:
          type: string
      type: object
    httpapi.ArchiveInitBuildResponse:
      properties:
        build_id:
          type: string
        source_type:
          type: string
        upload_expires_at:
          type: string
        upload_url:
          type: string
      type: object
    httpapi.AvailableRepo:
      properties:
        connected:
          type: boolean
        connected_project_id:
          type: string
        default_branch:
          type: string
        full_name:
          type: string
      type: object
    httpapi.AvailableReposResponse:
      properties:
        installation_id:
          type: integer
        repos:
          items:
            $ref: '#/components/schemas/httpapi.AvailableRepo'
          type: array
          uniqueItems: false
      type: object
    httpapi.BuildListResponse:
      properties:
        builds:
          items:
            $ref: '#/components/schemas/httpapi.BuildResponse'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    httpapi.BuildLogResponse:
      properties:
        build_id:
          type: string
        events:
          items:
            $ref: '#/components/schemas/cloudwatch.LogEvent'
          type: array
          uniqueItems: false
        log_group:
          type: string
        log_stream:
          type: string
        next_backward_token:
          type: string
        next_forward_token:
          type: string
      type: object
    httpapi.BuildPhaseResponse:
      properties:
        duration_ms:
          type: integer
        name:
          type: string
        status:
          type: string
      type: object
    httpapi.BuildResponse:
      properties:
        app_id:
          type: string
        attempt_number:
          type: integer
        author:
          type: string
        branch:
          type: string
        build_id:
          type: string
        build_target:
          $ref: '#/components/schemas/builds.BuildTarget'
        commit_message:
          type: string
        commit_sha:
          type: string
        completed_at:
          type: string
        duration_ms:
          type: integer
        error_category:
          type: string
        error_message:
          type: string
        error_phase:
          type: string
        executor_type:
          description: '"vm" or "container"; empty on pre-PR builds.'
