

[dev]
command = "netlify-extension dev"
publish = ".ntli/site/static"
port = 8989

[functions]
directory = "src/endpoints"

[[plugins]]
package = "@netlify/netlify-plugin-netlify-extension"

[build.environment]
# Excludes docs-site/docs-nextjs, the only packages with private @mdb deps, so
# no CodeArtifact token is needed.
PNPM_FLAGS = "--filter nextjs-extension..."

[build]
command = '''
set -euo pipefail
if [ -d platform ]; then cd platform; fi
pnpm --filter nextjs-extension run nextjs-extension:build
'''