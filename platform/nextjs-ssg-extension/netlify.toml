

[dev]
command = "netlify-extension dev"
publish = ".ntli/site/static"
port = 8989

[functions]
directory = "src/endpoints"

[[plugins]]
package = "@netlify/netlify-plugin-netlify-extension"

[build.environment]
# Excludes docs-site/docs-nextjs, the only packages with private @mdb deps, so
# no CodeArtifact token is needed. nextjs-extension and snooty-ast-to-mdx are
# imported by relative path, not declared as deps, so --filter won't pick them up.
PNPM_FLAGS = "--filter ssg-extension... --filter nextjs-extension... --filter snooty-ast-to-mdx"

[build]
command = '''
set -euo pipefail
if [ -d platform ]; then cd platform; fi
pnpm --filter ssg-extension run ssg-extension:build
'''