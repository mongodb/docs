extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/terminology/alphabetical-terms/'
level: suggestion
# Case-sensitive, because each swap differs from its replacement only in
# capitalization. With ignorecase, these swaps also flag correctly cased
# words, such as "Boolean" and "REST".
ignorecase: false
action:
  name: replace
swap:
  boolean: Boolean
  ethernet: Ethernet
  ReST: REST
  debian: Debian
  fedora: Fedora
  homebrew: Homebrew
  Kubeadm: kubeadm
  Kubectl: kubectl
  Kubelet: kubelet
  kubernetes: Kubernetes
