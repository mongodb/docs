   .. selected-content::
      :selections: driver, motor

      A :ref:`query filter document <document-query-filter>` can
      use the :ref:`query operators <query-selectors>` to specify
      conditions in the following form:

      .. code-block:: python

         { <field1>: { <operator1>: <value1> }, ... }

   .. selected-content::
      :selections: driver, java-sync

      In addition to the equality condition, MongoDB provides
      various :ref:`query operators <query-selectors>` to specify
      filter conditions. Use the
      com.mongodb.client.model.Filters_ helper methods to
      facilitate the creation of filter documents. For example:

      .. code-block:: java

         and(gte(<field1>, <value1>), lt(<field2>, <value2>), eq(<field3>, <value3>))

   .. selected-content::
      :selections: driver, java-async

      In addition to the equality condition, MongoDB provides
      various :ref:`query operators <query-selectors>` to specify
      filter conditions. Use the
      com.mongodb.client.model.Filters_ helper methods to
      facilitate the creation of filter documents. For example:

      .. code-block:: java

         and(gte(<field1>, <value1>), lt(<field2>, <value2>), eq(<field3>, <value3>))

   .. selected-content::
      :selections: driver, kotlin-coroutine

      In addition to the equality condition, MongoDB provides
      various :ref:`query operators <query-selectors>` to specify
      filter conditions. Use the `com.mongodb.client.model.Filters <{+java-api-docs+}/driver-core/com/mongodb/client/model/Filters.html>`__ helper methods to
      facilitate the creation of filter documents. For example:

      .. code-block:: kotlin

         and(gte(<field1>, <value1>), lt(<field2>, <value2>), eq(<field3>, <value3>))

   .. selected-content::
      :selections: driver, nodejs

      A :ref:`query filter document <document-query-filter>` can
      use the :ref:`query operators <query-selectors>` to specify
      conditions in the following form:

      .. code-block:: javascript

         { <field1>: { <operator1>: <value1> }, ... }

   .. selected-content::
      :selections: driver, php

      A :ref:`query filter document <document-query-filter>` can
      use the :ref:`query operators <query-selectors>` to specify
      conditions in the following form:

      .. code-block:: php

         [ <field1> => [ <operator1> => <value1> ], ... ]

   .. selected-content::
      :selections: driver, ruby

      A :ref:`query filter document <document-query-filter>` can
      use the :ref:`query operators <query-selectors>` to specify
      conditions in the following form:

      .. code-block:: ruby

         { <field1> => { <operator1> => <value1> }, ... }

   .. selected-content::
      :selections: driver, scala

      In addition to the equality condition, MongoDB provides
      various :ref:`query operators <query-selectors>` to specify
      filter conditions. Use the
      ``com.mongodb.client.model.Filters_`` helper methods to
      facilitate the creation of filter documents. For example:

      .. code-block:: scala

         and(gte(<field1>, <value1>), lt(<field2>, <value2>), equal(<field3>, <value3>))

   .. selected-content::
      :selections: driver, csharp

      In addition to the equality filter, MongoDB provides
      various :ref:`query operators <query-selectors>` to specify
      filter conditions. Use the
      :csharp-api:`FilterDefinitionBuilder <T_MongoDB_Driver_FilterDefinitionBuilder_1>`
      methods to create a filter document. For example:

      .. code-block:: csharp

         var builder = Builders<BsonDocument>.Filter;
         builder.And(builder.Eq(<field1>, <value1>), builder.Lt(<field2>, <value2>));

   .. selected-content::
      :selections: driver, go

      In addition to the equality filter, MongoDB provides
      various :ref:`query operators <query-selectors>` to specify
      filter conditions. Use the bson package to create query 
      operators for filter documents. For example:

      .. code-block:: go

         filter := bson.D{
             {"$and", bson.A{
                 bson.D{{"field1", bson.D{{"$eq", value1}}}},
                 bson.D{{"field2", bson.D{{"$lt", value2}}}},
             }},
         }

            To match an array field against any value in a list of
            values, use the :query:`$in` operator.

