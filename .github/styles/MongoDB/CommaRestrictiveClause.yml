extends: existence
message: "Don't use a comma to set off a restrictive clause (one that begins with that)."
link: 'https://www.mongodb.com/docs/meta/style-guide/style/punctuation/#commas'
ignorecase: true
level: suggestion
nonword: true
# Suggestion, because the pattern also matches a demonstrative "that" after
# an introductory clause ("If an operation fails, that operation...").
tokens:
  - ',\s+that'
