extends: existence
message: "Unless space is limited, use 'November 12, 2010' format, not '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/style/dates/'
ignorecase: true
level: suggestion
nonword: true
tokens:
  - '\b\d{1,2}/\d{1,2}/(?:\d{2}|\d{4})\b'
  # A four-digit year, so version numbers like 8.0.17 aren't read as dates.
  - '\b\d{1,2}\.\d{1,2}\.\d{4}\b'
  - '\b\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?),?\s+(?:\d{2}|\d{4})\b'
  - '\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2}(?:st|nd|rd|th)\b'
