extends: existence
message: "Use a ':ref:' link instead of ':doc:'."
link: https://www.mongodb.com/docs/meta/style-guide/style/links-and-cross-references/
level: warning
scope: raw
nonword: true
# Raw scope because Vale doesn't see role syntax in rendered text. The
# lookbehind skips ``:doc:`` written as an inline literal.
tokens:
  - '(?<![`\w]):doc:`'
