    path: .claude/scripts/feature-branch.sh
    note: "Deterministic git flow for the feature-branch workflow (create/sync/start-task)."
    readme_description: "Deterministic git flow for the feature-branch workflow: create, sync, start-task, and daily-sync"
    dris:
      - erabil-mdb
    last_reviewed: 2026-10-28
    review_cadence_days: 30
