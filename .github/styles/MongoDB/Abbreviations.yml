extends: conditional
message: "Spell out '%s', unless it is a common abbreviation, for the first use in this article or topic."
link: 'https://www.mongodb.com/docs/meta/style-guide/style/abbreviations/'
level: suggestion
ignorecase: false
# Skip Jira issue keys (TOOLS-4228) and the .NET platform name.
first: '(?<![.\w])([A-Z]{3,5})\b(?!-\d)'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
exceptions:
  - API
  - ARM
  - ASCII
  - AWS
  - BIOS
  - BSON
  - CD
