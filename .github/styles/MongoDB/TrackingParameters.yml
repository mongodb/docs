extends: existence
message: "Remove the tracking parameter '%s' from the URL."
link: https://www.mongodb.com/docs/meta/style-guide/style/links-and-cross-references/
level: error
scope: raw
nonword: true
# Raw scope because Vale doesn't see link targets in rendered text. Matches
# only inside a URL, so the style guide's ``?tck=docs`` examples don't match.
tokens:
  - '(?<=https?://[^\s<>`]*)[?&](?:tck|jmp)=[^&\s<>`]*'
  - '(?<=https?://(?:www\.)?mongodb\.com[^\s<>`]*)[?&]utm_[a-z]+=[^&\s<>`]*'
