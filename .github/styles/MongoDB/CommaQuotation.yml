extends: existence
message: "When a comma is required after a quotation that's embedded in text, place the comma inside the closing quotation mark."
link: 'https://www.mongodb.com/docs/meta/style-guide/style/punctuation/#commas'
level: suggestion
scope: sentence
nonword: true
# Only flag a comma outside a quoted phrase of two or more words. A single
# quoted token ("count", "trip_status") is usually a literal string, and the
# style guide puts punctuation outside quotation marks that enclose a
# literal. Periods aren't checked for the same reason.
tokens:
  - '"[A-Za-z]+(?:\s+[A-Za-z]+)+",'
