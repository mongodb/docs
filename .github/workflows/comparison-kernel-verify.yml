name: Comparison Kernel - Verify Binaries

on:
  pull_request:
    paths:
      - code-example-tests/tools/comparison-kernel/**
      - .github/actions/verify-comparison-kernel/**
      - .github/workflows/comparison-kernel-verify.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify comparison-kernel binaries are up to date
        uses: ./.github/actions/verify-comparison-kernel
