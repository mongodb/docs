---
title: "Save the file. Name it ``main.tf``."
ref: change-language
level: 4
content: |

  .. note::

     ``main.tf`` is the recommended filename for the entry point to a
     Terraform module.

---
title: "In the ``main.tf`` file, type ``atlas``, then press the **Enter** or **Return** key."
ref: bootstrap-atlas
level: 4
content: |

  The MongoDB Extension for VSCode populates the file with an example
  configuration using the `MongoDB Atlas
  <https://registry.terraform.io/providers/mongodb/mongodbatlas/latest>`__
  Terraform provider to create a Flex cluster.

---
title: "Update the |service| Terraform configuration to configure your cluster."
level: 4
ref: update-config
content: |

  The cursor moves to select the value of the ``name`` argument of the 
  ``mongodbatlas_project`` resource.

  Provide values for the following arguments to configure your cluster:

  .. tip::

     Press the **Tab** key to select to the next argument in 
     the template that you should update.

  .. list-table::
     :header-rows: 1

     * - Attribute
       - Value

     * - | ``mongodbatlas_project``
         | ``.name``
       - Name of the |service| project that this configuration creates.

     * - | ``mongodbatlas_advanced_cluster``
         | ``.name``
       - Name of the |service| Flex cluster that this configuration
         creates.

     * - | ``mongodbatlas_advanced_cluster``
         | ``.replication_specs.``
         | ``region_configs.``
         | ``backing_provider_name``
       - Provider on which the |service| Flex cluster that this
         configuration creates is hosted. Choose one of the following
         accepted values:

         - ``AWS``
         - ``AZURE``
         - ``GCP``

     * - | ``mongodbatlas_advanced_cluster``
         | ``.replication_specs.``
         | ``region_configs.``
         | ``region_name``
       - Region to which the |service| Flex cluster that this
         configuration creates is deployed. Ensure that the region you
         chose supports Flex clusters.

         For details about the regions that each provider supports, see
         the following sections in the |service| documentation:

         - :atlas:`Amazon Web Services </reference/amazon-aws/>`
         - :atlas:`Google Cloud Platform </reference/google-gcp/>`
         - :atlas:`Microsoft Azure </reference/microsoft-azure/>`

---
title: "Update the ``local`` variables."
level: 4
ref: update-local-variables
content: |

  .. warning::

     The ``local`` variables contain sensitive information. **Do not** 
     check these values in to a repository that is available publicly.

  Provide values for the following ``local`` variables:

  .. list-table::
     :header-rows: 1
     :widths: 50 50

     * - Variable
       - Value

     * - ``mongodb_atlas_client_id``
       - |service| service account client ID.

     * - ``mongodb_atlas_client_secret``
       - |service| service account client secret.

     * - ``mongodb_atlas_org_id``
       - |service| organization ID in which you want to create a
         project.

     * - ``mongodb_atlas_database_username``
       - Username of the MongoDB database user that |service| creates
         for your cluster. 

     * - ``mongodb_atlas_database_user_password``
       - Password for the MongoDB database user named in
         ``mongodb_atlas_database_username``.

     * - ``mongodb_atlas_accesslistip``
       - IP address or CIDR block from which your |service| cluster is
         accessible.

  .. note::

     The template authenticates to |service| with a service account.
     API keys are also supported, but service accounts are the
     recommended authentication method. To learn about both methods,
     see the `MongoDB Atlas Terraform Provider authentication guide
     <https://registry.terraform.io/providers/mongodb/mongodbatlas/latest/docs/guides/provider-configuration#service-account-recommended>`__.

  .. example:: Use an Input Variables File to Maximize security

     To maximize security, consider taking the following steps: 

     a. Define the ``local`` variables in an `input variables
        <https://developer.hashicorp.com/terraform/language/values/variables>`__
        file.

        .. code-block:: none

          variable "mongodb_atlas_client_id" {
            default = "my-client-id"
          }

          variable "mongodb_atlas_client_secret" {
            default = "my-client-secret"
          }

     #. Exclude the input variables file from your repository. For
        example, add the filename to the ``.gitignore`` file for your
        repository.
     #. Reference variables from the input variables file in the
        ``main.tf`` file by prefacing them with ``var.``.

        .. code-block:: none

          provider "mongodbatlas" {
            client_id     = var.mongodb_atlas_client_id
            client_secret = var.mongodb_atlas_client_secret
          }
---
title: "Add optional configuration options to the ``main.tf`` file."
level: 4
ref: optional-tf-config
content: |

  For a complete list of supported configuration options, see the
  `MongoDB Atlas Terraform Provider documentation
  <https://registry.terraform.io/providers/mongodb/mongodbatlas/latest>`__.

  For production deployments, consider the official
  `MongoDB Atlas Cluster module
  <https://registry.terraform.io/modules/terraform-mongodbatlas-modules/cluster/mongodbatlas/latest>`__,
  which bundles the cluster resource with production
  best-practice defaults.

  .. note::

     Flex clusters don't support all configurations
     available with the MongoDB Atlas Terraform provider. For a list of
     unsupported configurations, see the :atlas:`Atlas documentation
     </reference/flex-limitations/>`.

