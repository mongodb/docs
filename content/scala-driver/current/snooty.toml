name = "scala"
title = "Scala Driver"

intersphinx = [
    "https://www.mongodb.com/docs/manual/objects.inv",
    "https://www.mongodb.com/docs/drivers/objects.inv",
    "https://www.mongodb.com/docs/atlas/objects.inv",
    "https://www.mongodb.com/docs/objects.inv",
]

sharedinclude_root = "https://raw.githubusercontent.com/10gen/docs-shared/main/"

toc_landing_pages = [
    "/connect",
    "/connect/connection-options",
    "/crud",
    "/crud/query",
    "/crud/update",
    "/data-formats",
    "/indexes",
    "/logging-monitoring",
    "/logging-monitoring/monitoring",
    "/security",
    "/security/authentication",
    "/reference",
]

[constants]
driver-short = "Scala driver"
driver-long = "MongoDB Scala Driver"
version = "5.9"
full-version = "{+version+}.2"
language = "Scala"
language-version-2 = "2.13.16"
language-version-3 = "3.3.5"
mdb-server = "MongoDB Server"
api-root = "https://mongodb.github.io/mongo-java-driver/{+version+}/apidocs"
driver-api = "{+api-root+}/driver-scala/org/mongodb/scala"
core-api = "{+api-root+}/driver-core/com/mongodb"
driver-source-gh = "https://github.com/mongodb/mongo-java-driver"
rs-docs = "https://www.reactive-streams.org/reactive-streams-1.0.4-javadoc/org/reactivestreams"
rs-api = "https://mongodb.github.io/mongo-java-driver/{+version+}/apidocs/driver-reactive-streams/com/mongodb/reactivestreams"
mongocrypt-version = "{+full-version+}"
java-version = "23"
mongodb-server = "MongoDB Server"
stable-api = "Stable API"
snappy-version = "org.xerial.snappy:snappy-java:1.1.10.3"
zstd-version = "com.github.luben:zstd-jni:1.5.5-3"
netty-version = "io.netty:netty-all:4.1.87.Final"
search = "MongoDB Search"
vector-search = "MongoDB Vector Search"
slf4j-api-version = "2.0.13"
logback-version = "1.5.6"
log4j-slf4j-impl-version = "2.24.3"
log4j-core-version = "2.24.3"
