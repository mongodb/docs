# Agent Skill ownership and review manifest.
#
# Every skill under .claude/skills/ must have an entry here. This manifest also
# tracks the workflow custom agents (.claude/agents/) and their helper scripts
# (.claude/scripts/), listed in the `agents:` and `scripts:` sections at the end.
# The PR template for agent skills (.github/PULL_REQUEST_TEMPLATE/agent-skill.md)
# requires authors to add or update an entry when a skill, agent, or script is
# added or changed.
#
# Fields:
#   name                  string. Skill directory name (matches
#                         .claude/skills/<name>/).
#   path                  string. Repo-relative path to the skill directory.
#   dris                  list of 1-2 strings. Directly Responsible
#                         Individuals. Each entry is a GitHub username
#                         (preferred, no leading @) or email address. The
#                         first entry is the primary DRI; the second, if
#                         present, is the backup. DRIs own maintenance,
#                         review, and response to issues for this skill.
#   last_reviewed         string (ISO date, YYYY-MM-DD). The most recent
#                         review date. Update on any substantive change and
#                         on periodic review passes.
#   review_cadence_days   integer. Maximum days between reviews before the
#                         skill is considered stale. Default 90 during
#                         the current skills-launch evaluation period.
#   readme_section        string. Section heading this skill appears under
#                         in the generated README.md (e.g. "Universal
#                         Skills", "Grove & Code Examples"). Must match an
#                         existing heading in generate-readme.py's SECTIONS
#                         list, or the skill falls into "Other Skills".
#                         Ignored for entries whose path is outside
#                         .claude/skills/ (hooks, agents): those are always
#                         listed under "Other Tools".
#   readme_description    string, optional. Overrides the description shown
#                         in the generated README.md. Use it for entries
#                         with no SKILL.md or flow.md to read from.
#
# Example:
#   - name: example-skill
#     path: .claude/skills/example-skill
#     dris:
#       - octocat
#       - hubot
#     last_reviewed: 2026-04-22
#     review_cadence_days: 90
#     readme_section: Universal Skills

