# Security-scan manifest for the Atlas Charts docset. Conforms to
# references/SCHEMA.md.

docset: charts
# Verified DOCSP Jira components (DOCSP-64811, DOCSP-62718).
component:
  - "Charts"

docs:
  path: content/charts

security_considerations:

  - id: charts-no-unauthenticated-embedding-for-sensitive-data
    # Grounded in manage-data-sources.txt and embed-chart-anon-auth.txt.
    rule: >-
      Prose and examples must not recommend unauthenticated external data
      access — the Unauthenticated embedding option or public dashboard
      links — for data that is not public or non-sensitive, and must point
      to authenticated embedding when restricting access.
    applies_to: ["embed", "data source", "dashboard", "filter"]
    category: counter_best_practice_advice
    severity: High

  - id: charts-jwt-signing-keys-stay-server-side
    # Grounded in includes/steps-embed-chart-sdk-jwt.yaml and embed-chart-jwt-auth.txt.
    rule: >-
      Examples and prose for authenticated embedding must generate and sign
      JWTs in server-side code; signing secrets and keys must not be
      exposed to the client, embedded in client-side code, or hardcoded in
      browser-rendered examples.
    applies_to: ["embed", "authentication"]
    category: counter_best_practice_advice
    severity: High

  - id: charts-embedded-filters-must-not-expose-sensitive-fields
    # Grounded in charts-embedding-sdk.txt and filter-embedded-charts.txt.
    rule: >-
      Examples and prose that configure Allowed filter fields or pre-filter
      values for embedded charts and dashboards must not expose fields that
      reveal sensitive data, and content about embedding potentially
      sensitive data should use per-user injected filters with an
      authentication provider rather than viewer-editable filters.
    applies_to: ["embed", "filter"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

# No exception markers: no callout in the built AST caveats an insecure example.

validation: {}
