# Run with:  pnpm suite --config suites/manual.yaml
# Plan first: pnpm suite --config suites/manual.yaml --dry-run

# Batch id. Doubles as the base run id, so artifacts land under
# data/manual/manual/<name>/.
name: manual-sweep

project: manual/manual
pages: pages/manual.txt
locales: [es]

# Must differ from every translator below, to avoid self-preference bias.
judge: claude-fable-5-1

# Samples per translator; each repeat is a fresh translation.
repeats: 3

translators:
  # Anthropic: high, mid, low.
  - { backend: anthropic, model: claude-opus-5-5 }
  - { backend: anthropic, model: claude-sonnet-5-5 }
  - { backend: anthropic, model: claude-haiku-5-5 }
  # OpenAI: high, mid, low.
  - { backend: openai, model: gpt-6-astra }
  - { backend: openai, model: gpt-6.1-sol }
  - { backend: openai, model: gpt-6-luna }
