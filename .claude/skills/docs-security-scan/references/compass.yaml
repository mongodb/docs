# Security-scan manifest for the MongoDB Compass docset. Conforms to
# references/SCHEMA.md.

docset: compass
# Verified against DOCSP-66066.
component:
  - "Compass"

docs:
  path: content/compass

# Connection strings are pasted into the UI or CLI; no env-var idiom for credentials.
disable_universal: [U-7]

security_considerations:

  - id: compass-connection-export-must-be-encrypted
    # Grounded in connect/favorite-connections/import-export.txt and
    # connect/connect-from-the-command-line.txt.
    rule: >-
      Procedures and CLI examples that export saved connections must not
      present passphrase-less export as the default or recommended path;
      an example of unencrypted export must sit with the caveat that
      usernames and passwords are included in plaintext and to encrypt
      the exported file with a passphrase.
    applies_to: ["export", "import", "favorite-connections", "connect"]
    category: counter_best_practice_advice
    severity: Medium

  # Category #3 (absent_consideration) is not assessed yet.

exception_markers:
  # Taken from callouts in the built Compass AST.
  - directive: warning
    phrases:
      - "shows credentials in plaintext by default"
      - "may cause a security vulnerab"
  - directive: important
    phrases:
      - "encrypt the exported file with a passphrase"
      - "use a passphrase to encrypt the password"

validation:
  known_intentional:
    - page: connect/advanced-connection-options/tls-ssl-connection.txt
      pattern: >-
        The TLS/SSL tab table documenting tlsInsecure,
        tlsAllowInvalidHostnames, and tlsAllowInvalidCertificates.
      caveat: >-
        Adjoining `.. warning::` — "Enabling tlsInsecure,
        tlsAllowInvalidHostnames, and tlsAllowInvalidCertificates may
        cause a security vulnerabilty" (sic).
