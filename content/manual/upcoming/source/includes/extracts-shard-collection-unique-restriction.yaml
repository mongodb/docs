ref: _shard-collection-unique-restriction
content: |

   - If the collection is empty, {{op}} creates the unique index on the shard key
     if such an index does not already exist.

   - If the collection is not empty, you must create the index first
     before using {{op}}.

   - If the collection has an index that supports the shard key but that index is
     not unique, {{op}} returns an error.

   Although you can have a unique :term:`compound index` where the shard
   key is a :ref:`prefix <compound-index-prefix>`, if using ``unique``
   parameter, the collection must have a unique index that is on the shard
   key.
---
ref: _shard-collection-unique-default
content: |

   If you omit ``unique`` or specify ``unique: false``, {{op}} doesn't
   change the collection's existing indexes. If a unique index on the
   shard key already exists, that index remains unique and the sharded
   cluster continues to enforce the uniqueness constraint on the shard
   key values across shards.
---
