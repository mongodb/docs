# Security-scan manifest for the MongoDB CLI (mongocli) docset. Conforms to
# references/SCHEMA.md.

docset: mongocli
# Verified against recent MongoCLI DOCSP tickets (DOCSP-65991, DOCSP-65701).
component:
  - "mcli"

docs:
  path: content/mongocli/upcoming
  # Everything except the generated command/* reference, release-notes.txt, and third-party-licenses.txt.
  surface_pages:
    - "configure/*"
    - "install/*"
    - "quick-start/*"
    - "reference/*"
    - "configure.txt"
    - "index.txt"
    - "install.txt"
    - "reference.txt"
    - "troubleshooting.txt"
    - "verify-packages.txt"

security_considerations: []

exception_markers:
  # Taken from callouts in the built mongocli AST.
  - directive: important
    phrases:
      # includes/admonitions/secure-config-file.rst, carried on configure/configuration-file.txt.
      - "keys in plaintext"

validation:
  known_intentional:
    - page: configure/configuration-file.txt
      pattern: >-
        The config.toml profile example storing public_api_key and
        private_api_key values in plaintext.
      caveat: >-
        Same-page `.. important::` (includes/admonitions/
        secure-config-file.rst) — "Your API keys are like passwords. The
        configuration file stores API keys in plaintext, so ensure that you
        secure the configuration file appropriately."
