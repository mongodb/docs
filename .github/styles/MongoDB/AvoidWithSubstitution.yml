extends: substitution
message: "Consider if '%s' makes sense instead of '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/terminology/alphabetical-terms/'
level: suggestion
ignorecase: true
action:
  name: replace
# Context-dependent swaps only. Unconditional swaps are in Terms.yml, and
# case-only swaps are in Capitalization.yml.
swap:
  'all\s+caps': uppercase
  application: app
  architected: 'designed, created, planned'
  architects: 'designs, creates, plans'
  argument: option
  at-scale: at scale
  'backward\s+slash': backslash
  'be\s+sure': ensure or verify
  blackout: scheduled outage or scheduled downtime
  'bottom\s+left': lower left
  'bottom\s+right': lower right
  'bring\s+up': start/turn on/open
  client-server: client/server
  comprise: consist of/ include/ contain
  'computer\s+machine': host
  'data\s+center': region
  desire: want
  desired: 'wanted, appropriate, required'
  'destroy(?:s|ed|ing)?': remove or delete
  'different\s+than': different from
  'drill\s+down': navigate
  'drop-down\s+list': list
  'drop-down\s+menu': menu
  'due\s+to': because of
  FAQs: FAQ
  'for\s+instance': for example
  'forward\s+slash': slash
  free: 'no charge, no cost'
  'grayed\s+out': dimmed
  guarantee: intend or expect
  guaranteed: 'intended, expected, guaranteed'
  'hash\s+sign': number sign
  'hash\s+symbol': number sign
  'have\s+to': must
  indices: indexes
  'kick\s+off': start
  'kicks\s+off': starts
  'launch(?:es|ed|ing)?': start
  like: such as
  logfile: log file
  matrices: matrixes
  'need\s+to': must
  'not\s+applicable': NA
  off-premise: off-premises
  'off\s+premise': off-premises
  'off\s+premises': off-premises
  'on\s+prem': on-premises
  on-premise: on-premises
  'on\s+premise': on-premises
  'on\s+premises': on-premises
  OOTB: out-of-the-box
  pop-up: dialog box
  'pound\s+sign': number sign
  'pound\s+symbol': number sign
  'quote\s+marks': quotation marks
  read-write: read/write
  readonly: read-only
  'refer\s+to': see
  roadmap: road map
  'start\s+up': start
  synchronize: sync
  timezone: time zone
  'to\s+architect': 'to design, to create, to plan'
  'top\s+left': upper left
  'top\s+right': upper right
  unselect: clear
  'up\s+to\s+date': up-to-date
  uptodate: up-to-date
  versus: compared with
  wrong: incorrect or inconsistent
