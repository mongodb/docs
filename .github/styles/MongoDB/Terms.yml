extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/terminology/alphabetical-terms/'
level: warning
ignorecase: true
action:
  name: replace
# Spellings and word choices that the Alphabetical List of Terms states
# without exceptions. Context-dependent swaps belong in
# AvoidWithSubstitution.yml at suggestion level.
swap:
  appendices: appendixes
  backwards: backward
  'can\s+not(?!\s+only)': cannot
  cancelled: canceled
  cancelling: canceling
  catalogue: catalog
  'click\s+on': click
  co-locate: colocate
  co-location: colocation
  collocate: colocate
  collocation: colocation
  'data\s+base': database
  deinstall: uninstall
  deselect: clear
  'double\s+click': double-click
  'double\s+tap': double-tap
  'down\s+time': downtime
  e-commerce: ecommerce
  e-mail: email
  homepage: home page
  lower-case: lowercase
  'make\s+sure': ensure
  meta-data: metadata
  'name\s+space': namespace
  nameserver: name server
  off-line: offline
  on-line: online
  off-site: offsite
  on-site: onsite
  plug-in: plugin
  scrollbar: scroll bar
  'slash\s+mark': slash
  synch: sync
  'time\s+line': timeline
  'time\s+stamp': timestamp
  timeframe: time frame
  'tool\s+bar': toolbar
  'tool\s+box': toolbox
  'tool\s+kit': toolkit
  'tool\s+tip': tooltip
  towards: toward
  upper-case: uppercase
  useable: usable
  whitepaper: white paper
  wi-?fi: Wi-Fi
  'wild\s+card': wildcard
  wish: want
  zeroes: zeros
