extends: existence
message: "Use present tense instead of '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-present-tense/'
level: warning
ignorecase: true
# Future tense that describes the reader's current task or the product's
# immediate response. AvoidFutureTense covers other uses of "will" at
# suggestion level, because the style guide allows future tense for events
# that happen later from the reader's perspective.
raw:
  - '\b(?:you|this|it)\s+will\s+(?:then\s+)?(?:see|need|be able to|have to|want to|notice|get|find|learn|be prompted|be redirected|be taken)\b|\bwill\s+then\b|\bwill\s+be\s+able\s+to\b|\bwill\s+(?:be\s+)?(?:displayed|shown|returned|created|prompted|redirected)\b'
