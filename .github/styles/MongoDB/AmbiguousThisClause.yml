extends: existence
message: "Replace '%s' with the noun it refers to."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-pronouns-carefully/'
level: suggestion
scope: sentence
# "this" plus a verb at the start of a clause. AmbiguousPronouns covers the
# start of a sentence.
raw:
  - '(?<=(?:, |; ))this(?=\s+(?:is|means|causes|allows|lets|enables|ensures|prevents|makes|can|could|will|would|should|may|might|requires|results|happens|occurs|helps|improves|reduces|increases|creates|returns|gives|provides|applies|works)\b)'
