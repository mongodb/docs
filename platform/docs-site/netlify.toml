[build.environment]
SECRETS_SCAN_ENABLED = "false"
NEXTJS_EXTENSION_ENABLED = "false"
NEXTJS_EXTENSION_ENABLED_STAGING = "false"
NEXTJS_EXTENSION_ENABLED_STAGING_2 = "false"
NEXTJS_SSG_EXTENSION_ENABLED = "true"
POPULATE_METADATA_ENABLED = "false"

[context.production.environment]
ENV = "dotcomprd"
# Only the production context may emit an indexable robots meta tag. Every
# other context omits this and fails closed. See src/utils/seo.tsx.
NEXT_PUBLIC_ALLOW_INDEXING = "true"

[context.preprd.environment]
ENV = "dotcomstg"

[context.deploy-preview.environment]
ENV = "prd"

[context.branch-deploy.environment]
ENV = "prd"

[context.preview-server.environment]
ENV = "prd"

[context.dev.environment]
ENV = "stg"

# Netlify adds this header to Deploy Previews on its own, but not to Branch
# Deploys.
[[context.branch-deploy.headers]]
for = "/*"
[context.branch-deploy.headers.values]
X-Robots-Tag = "noindex, nofollow"

# Manual uses a bucketed assetPrefix so its _next assets do not collide with
# landing's identical basePath in b2k (MANUAL_SLUGS). Active manual:
# /docs/docs_static_manual. Inactive/EOL manual (NEXT_PUBLIC_INACTIVE_MANUAL=true):
# /docs/docs_static_manual_inactive. Next.js rewrites do not apply to Netlify
# static asset serving, so proxy each bucket path to the real assets.
[[redirects]]
from = "/docs/docs_static_manual/_next/*"
to = "/docs/_next/:splat"
status = 200

[[redirects]]
from = "/docs/docs_static_manual_inactive/_next/*"
to = "/docs/_next/:splat"
status = 200

# Applies soft redirects on 404s (static build has no server). See src/redirects/README.md.
[[edge_functions]]
path = "/docs/*"
function = "soft-redirects"

# Pretty URLs rewrite `/file/` ↔ `/file` when the last segment looks like a
# filename. That fights dotted page slugs (`db.collection.findOneAndUpdate`).
# Middleware + the soft-redirects edge function already add trailing slashes.
[build.processing.html]
pretty_urls = false

[dev]
framework = "next"
command = "next dev"
publish = ".next"

[build]
# Mints CodeArtifact auth when NPM_AWS_KEY is set; see platform/scripts/install-deps.mjs.
command = '''
set -euo pipefail
cd platform/docs-site
node ../scripts/install-deps.mjs
pnpm run build
'''
