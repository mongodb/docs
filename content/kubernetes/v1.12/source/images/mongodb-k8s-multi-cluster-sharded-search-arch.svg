<svg width="960px" height="660px" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- External MongoDB Sharded Cluster across two VM clusters (top, outside K8s) -->
  <text x="480" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#001E2B">External MongoDB Sharded Cluster (shards span both VM clusters)</text>

  <!-- VM Cluster 1 -->
  <rect x="20" y="34" width="440" height="116" rx="12" fill="#E3F5ED" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="22" width="110" height="24" rx="6" fill="#00684A"/>
  <text x="95" y="34" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">VM Cluster 1</text>

  <rect x="165" y="44" width="150" height="44" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="240" y="60" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-0</text>
  <text x="240" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">shard 0 members</text>

  <rect x="165" y="94" width="150" height="44" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="240" y="110" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-1</text>
  <text x="240" y="126" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">shard 1 members</text>

  <!-- VM Cluster 2 -->
  <rect x="500" y="34" width="440" height="116" rx="12" fill="#E3F5ED" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="520" y="22" width="110" height="24" rx="6" fill="#00684A"/>
  <text x="575" y="34" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">VM Cluster 2</text>

  <rect x="645" y="44" width="150" height="44" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="720" y="60" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-0</text>
  <text x="720" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">shard 0 members</text>

  <rect x="645" y="94" width="150" height="44" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="720" y="110" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">&lt;name&gt;-1</text>
  <text x="720" y="126" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">shard 1 members</text>

  <!-- Per-shard replication between the two VM clusters -->
  <line x1="315" y1="66" x2="645" y2="66" stroke="#00684A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="315" y1="116" x2="645" y2="116" stroke="#00684A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="480" y="91" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">replication</text>

  <!-- TLS arrows from VMs into each cluster's "Expose envoy proxy externally" tab (on cluster border) -->
  <line x1="240" y1="150" x2="240" y2="173" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="150" x2="720" y2="173" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Central (member 0) Kubernetes cluster ===== -->
  <rect x="20" y="185" width="440" height="425" rx="16" fill="none" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="100" y="598" width="280" height="24" rx="6" fill="#00684A"/>
  <text x="240" y="610" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Central Kubernetes Cluster (member 0)</text>
  <!-- "Expose envoy proxy externally" tab on the cluster's top border -->
  <rect x="110" y="173" width="260" height="24" rx="6" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="240" y="185" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#001E2B">Expose envoy proxy externally</text>
  <!-- Arrow from the expose tab down to the Envoy box -->
  <line x1="240" y1="197" x2="240" y2="309" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="252" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">TLS, port 27028</text>

  <!-- Operator box (central cluster only) -->
  <rect x="45" y="205" width="150" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="120" y="233" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#001E2B">Kubernetes Operator</text>

  <!-- Envoy Proxy, cluster 0 -->
  <rect x="80" y="310" width="320" height="98" rx="10" fill="#001E2B" stroke="#00ED64" stroke-width="1.5"/>
  <text x="240" y="333" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00ED64">Envoy Proxy</text>
  <text x="240" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9BCFC3">(operator-managed, per cluster)</text>
  <circle cx="104" cy="371" r="3" fill="#00ED64"/>
  <text x="116" y="375" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">Routes by SNI hostname</text>
  <circle cx="104" cy="391" r="3" fill="#00ED64"/>
  <text x="116" y="395" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">mTLS to local mongot backends</text>

  <!-- Arrows Envoy -> mongot, cluster 0 -->
  <line x1="150" y1="408" x2="150" y2="466" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="330" y1="408" x2="330" y2="466" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mongot StatefulSets, cluster 0 -->
  <rect x="70" y="470" width="160" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="150" y="493" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">mongot for &lt;name&gt;-0</text>
  <text x="150" y="513" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">StatefulSet (cluster 0)</text>

  <rect x="250" y="470" width="160" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="330" y="493" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">mongot for &lt;name&gt;-1</text>
  <text x="330" y="513" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">StatefulSet (cluster 0)</text>

  <!-- ===== Member cluster 1 ===== -->
  <rect x="500" y="185" width="440" height="425" rx="16" fill="none" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="592.5" y="598" width="255" height="24" rx="6" fill="#00684A"/>
  <text x="720" y="610" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Kubernetes Cluster (member 1)</text>
  <!-- "Expose envoy proxy externally" tab on the cluster's top border -->
  <rect x="590" y="173" width="260" height="24" rx="6" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="720" y="185" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#001E2B">Expose envoy proxy externally</text>
  <!-- Arrow from the expose tab down to the Envoy box -->
  <line x1="720" y1="197" x2="720" y2="309" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="732" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">TLS, port 27028</text>

  <!-- Envoy Proxy, cluster 1 -->
  <rect x="560" y="310" width="320" height="98" rx="10" fill="#001E2B" stroke="#00ED64" stroke-width="1.5"/>
  <text x="720" y="333" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00ED64">Envoy Proxy</text>
  <text x="720" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9BCFC3">(operator-managed, per cluster)</text>
  <circle cx="584" cy="371" r="3" fill="#00ED64"/>
  <text x="596" y="375" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">Routes by SNI hostname</text>
  <circle cx="584" cy="391" r="3" fill="#00ED64"/>
  <text x="596" y="395" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">mTLS to local mongot backends</text>

  <!-- Arrows Envoy -> mongot, cluster 1 -->
  <line x1="630" y1="408" x2="630" y2="466" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="810" y1="408" x2="810" y2="466" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mongot StatefulSets, cluster 1 -->
  <rect x="550" y="470" width="160" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="630" y="493" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">mongot for &lt;name&gt;-0</text>
  <text x="630" y="513" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">StatefulSet (cluster 1)</text>

  <rect x="730" y="470" width="160" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="810" y="493" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" font-weight="700" fill="#001E2B">mongot for &lt;name&gt;-1</text>
  <text x="810" y="513" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">StatefulSet (cluster 1)</text>

  <!-- Cross-cluster: operator reconciles Search resources on member cluster 1 (dashed) -->
  <path d="M 195 233 H 500" fill="none" stroke="#00684A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="250" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">reconciles Search resources</text>

  <!-- Footnote -->
  <text x="480" y="644" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">Each shard's members run on VMs spread across the VM clusters. The operator creates one mongot StatefulSet per shard in each member Kubernetes cluster.</text>

  <!-- MongoDB leaf logo mark -->
  <g transform="translate(915, 14)">
    <path d="M10 0 C10 0, 18 8, 18 16 C18 24, 10 28, 10 28 C10 28, 2 24, 2 16 C2 8, 10 0, 10 0Z" fill="#00ED64"/>
    <line x1="10" y1="14" x2="10" y2="30" stroke="#00684A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
