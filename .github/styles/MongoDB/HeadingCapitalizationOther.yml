extends: existence
message: "Check the capitalization of lowercase words in the heading '%s'."
link: https://www.mongodb.com/docs/meta/style-guide/style/titles-and-headings/#guidelines-for-headline-style-capitalization
level: suggestion
scope: heading
# Lowercase words that HeadingCapitalization doesn't cover. Minor words and
# names that are always lowercase, such as command names, are exempt.
# Matches the whole heading so that Vale reports the heading's line.
raw:
  - '^[A-Z](?=[^?(]*\s(?!(?:a|an|the|and|but|for|nor|or|yet|so|to|of|in|on|at|by|with|about|from|as|into|through|over|under|via|per|vs|versus|without|within|across|after|before|between|during|against|among|around|behind|below|above|beyond|near|off|onto|out|up|down|upon|than|like|if|toward|towards|until|since|along|inside|outside|throughout|beside|besides|past|unlike|except|amid|beneath|your|you|this|that|these|those|all|no|is|are|be|was|were|it|its|our|my|their|mongod|mongos|mongosh|mongo|mongodump|mongorestore|mongoexport|mongoimport|mongotop|mongostat|mongofiles|mongosync|mongot|mongocryptd|mongokerberos|mongoldap|libmongocrypt|bsondump|kubectl|kubeadm|kubelet|null|undefined|true|false|npm|pip)\b)[a-z][a-z]+\b)[^?(]*$'
