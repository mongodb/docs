ref: dbtools-compatibility-all
content: |

   {+dbtools+} version ``{+release+}`` supports the following versions
   of the MongoDB server:

   - MongoDB 9.0
   - MongoDB 8.3
   - MongoDB 8.2
   - MongoDB 8.1
   - MongoDB 8.0
   - MongoDB 7.0
   - MongoDB 6.0
   - MongoDB 5.0
   - MongoDB 4.4
   - MongoDB 4.2

   The {+dbtools+} do not support MongoDB Server versions earlier than
   4.2. Attempts to connect to an earlier Server version fail.

---
