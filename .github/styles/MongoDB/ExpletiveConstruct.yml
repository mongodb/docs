extends: existence
message: "Avoid '%s'. Rewrite to lead with the subject."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/write-clear-concise-sentences-paragraphs/'
level: suggestion
ignorecase: true
nonword: true
# "There is/are" is an expletive anywhere in a sentence. "It is" is an
# expletive only as a dummy subject ("It is important that..."), so match it
# only before an adjective and a that/to clause. A bare "It is" also matches
# "It is fast", where "it" has a real antecedent.
tokens:
  - '\bthere(?:\s+is|''s|\s+are|\s+was|\s+were)\b'
  - '\bit(?:\s+is|''s|\s+was)\s+(?:important|necessary|possible|recommended|required|advisable|best|critical|essential|helpful|useful|common|likely|unlikely|easy|difficult|safe|good\s+practice)\s+(?:that|to)\b'
