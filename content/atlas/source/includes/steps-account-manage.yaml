stepnum: 2
ref: manage-mongodb-account
level: 4
title: "Click :guilabel:`Manage your MongoDB Account`."
content: |
  The :guilabel:`Profile Info` page opens. From here, you can:

  - Update the name associated with your |service| account.

  - (Optional) Add your:
  
    - Employment information
    - Phone number
    - Country

  - Delete your |service| account.

  If you manage your account through a third-party service like Google,
  GitHub, or Vercel you must update your personal information through that
  service.

  From the left-side navigation bar, you can also access the
  :guilabel:`Login and Security` page, where you can:

  - Unlink your MongoDB |service| account from
    :ref:`Google <unlink-your-mongodb-account-from-google>`,
    :ref:`GitHub <unlink-your-mongodb-account-from-github>`, or
    :ref:`Vercel <unlink_account_from_vercel>`.

  - Add or reset your password.

  - Update your email address.
  
  - :ref:`Manage Your Multi-Factor Authentication
    Options <atlas-enable-mfa>`.

