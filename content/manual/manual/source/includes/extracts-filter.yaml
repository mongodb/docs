      :selections: driver, php

      To specify equality conditions, use ``<field> => <value>``
      expressions in the
      :ref:`query filter document <document-query-filter>`:

      .. code-block:: php

         [ <field1> => <value1>, ... ]

   .. selected-content::
      :selections: driver, ruby

      To specify equality conditions, use ``<field> => <value>``
      expressions in the
      :ref:`query filter document <document-query-filter>`:

      .. code-block:: ruby

