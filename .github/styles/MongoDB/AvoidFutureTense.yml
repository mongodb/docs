extends: existence
message: "Avoid future tense: '%s'. Use present tense instead."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/use-present-tense/'
level: suggestion
# FutureTenseUnjustified reports these phrases at warning level, so skip them
# here rather than report one phrase twice. The first lookahead skips phrases
# that only count when the reader or the product is the subject; the second
# skips phrases that count regardless of the subject.
raw:
  - '(?:going\s+to|will|won''t)\s+(?!(?<=\b(?:[Yy]ou|[Tt]his|[Ii]t)\s+will\s+)(?:then\s+)?(?:see|need|be able to|have to|want to|notice|get|find|learn|be prompted|be redirected|be taken)\b)(?!(?:then\b|be able to\b|be (?:displayed|shown|returned|created|prompted|redirected)\b|(?:displayed|shown|returned|created|prompted|redirected)\b))[a-zA-Z]+|[a-zA-Z]+''ll\s+[a-zA-Z]+'
