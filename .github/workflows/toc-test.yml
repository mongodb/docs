name: ToC Formatting and Linting

on:
  pull_request:
  push:
    branches:
      - 'backport/**'
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      toc: ${{ steps.filter.outputs.toc }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for ToC changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "toc=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "toc=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_BASE=$(git merge-base \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}") || exit 1
          CHANGED_FILES=$(git diff --name-only \
            "$MERGE_BASE" \
            "${{ github.event.pull_request.head.sha }}") || exit 1
          if echo "$CHANGED_FILES" | grep -qE '^content/table-of-contents/|^\.github/workflows/toc-test\.yml$'; then
            echo "toc=true" >> "$GITHUB_OUTPUT"
          else
            echo "toc=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests in table-of-contents
    needs: changes
    if: needs.changes.outputs.toc == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_BASE_64_AUTH: ${{ secrets.NPM_BASE_64_AUTH }}
      NPM_EMAIL: ${{ secrets.NPM_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@d648c2dd069001a242c621c8306af467f150e99d
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: content/table-of-contents/pnpm-lock.yaml

      - name: Install
        run: pnpm install
        working-directory: ./content/table-of-contents

      - name: Lint & Format
        run: pnpm run lint && pnpm run format
        working-directory: ./content/table-of-contents

      - name: Test
        run: pnpm run test
        working-directory: ./content/table-of-contents

  toc-status:
    name: ToC Formatting and Linting
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || \
                "${{ needs.changes.result }}" == "cancelled" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "ToC CI failed (changes: ${{ needs.changes.result }}, test: ${{ needs.test.result }})."
            exit 1
          fi
          echo "ToC CI passed (test result: ${{ needs.test.result }})"
