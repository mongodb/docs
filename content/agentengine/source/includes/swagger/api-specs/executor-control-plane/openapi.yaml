        git_info:
          $ref: '#/components/schemas/builds.GitInfo'
        image_uri:
          type: string
        is_latest_for_commit:
          type: boolean
        label:
          type: string
        log_group:
          type: string
        log_stream:
          type: string
        max_build_attempts:
          type: integer
        org_id:
          type: string
        phases:
          items:
            $ref: '#/components/schemas/httpapi.BuildPhaseResponse'
          type: array
          uniqueItems: false
        queued_at:
          type: string
        retry_of:
          type: string
        source_type:
          type: string
        started_at:
          type: string
        status:
          type: string
        trigger:
          type: string
      type: object
    httpapi.CancelBuildResponse:
      properties:
        build_id:
          type: string
        status:
          type: string
      type: object
    httpapi.CancelDeployResponse:
      properties:
        deployment_id:
          type: string
        status:
          type: string
      type: object
    httpapi.ComponentStatusResponse:
      properties:
        available:
          type: boolean
        name:
          type: string
        ready_replicas:
          type: integer
        scope:
          type: string
        type:
          type: string
      type: object
    httpapi.ConditionResponse:
      properties:
        last_transition_time:
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      type: object
    httpapi.CreateAppRequest:
      properties:
        branch:
          type: string
        build_config:
          $ref: '#/components/schemas/apps.BuildConfig'
        github_installation_id:
          type: integer
        name:
          type: string
        repo_url:
          type: string
        source_type:
          type: string
        subdirectory:
          type: string
        workspace:
          type: string
        workspace_name:
          type: string
      type: object
    httpapi.DeploymentEventResponse:
      properties:
        category:
          type: string
        component:
          type: string
        condition_ref:
          type: string
        deployment_id:
          type: string
        message:
          type: string
        project_id:
          type: string
        reason:
          type: string
        sequence:
          type: integer
        severity:
          type: string
        ts:
          type: string
        workspace_id:
          type: string
      type: object
    httpapi.DeploymentListResponse:
      properties:
        deployments:
          items:
            $ref: '#/components/schemas/httpapi.DeploymentResponse'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    httpapi.DeploymentResponse:
      properties:
        aer_http_endpoint:
          type: string
        aer_service_name:
          type: string
        agent_stack_name:
          type: string
        app_id:
          type: string
        branch:
          type: string
        build_id:
          type: string
        commit_sha:
          type: string
        completed_at:
          type: string
        component_images:
          $ref: '#/components/schemas/deploy.ComponentImages'
        components:
          items:
            $ref: '#/components/schemas/httpapi.ComponentStatusResponse'
          type: array
          uniqueItems: false
        conditions:
          items:
            $ref: '#/components/schemas/httpapi.ConditionResponse'
          type: array
          uniqueItems: false
        created_at:
          type: string
        deployment_id:
          type: string
        duration_ms:
          type: integer
        error_message:
          type: string
        executor_type:
          description: '"vm" or "container"; empty on pre-PR records.'
          type: string
        health:
          $ref: '#/components/schemas/httpapi.HealthResponse'
        image_uri:
          type: string
        last_event_seq:
          type: integer
        operator_namespace:
          type: string
        org_id:
          type: string
        post_deploy_completed_at:
          type: string
        post_deploy_error_message:
          type: string
        previous_image_uri:
          type: string
        project_id:
          type: string
        rollback_error:
          type: string
        rollback_from_id:
          type: string
        rollback_to_id:
          type: string
        started_at:
          type: string
        status:
          type: string
        target_namespace:
          type: string
        tool_service_name:
          type: string
        trigger:
          type: string
      type: object
    httpapi.ErrorResponse:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        error:
          type: string
        success:
          type: boolean
      type: object
    httpapi.HealthResponse:
      properties:
        available:
          type: boolean
        checked_at:
          type: string
        components:
          items:
            $ref: '#/components/schemas/httpapi.LiveComponentHealthResponse'
          type: array
          uniqueItems: false
      type: object
    httpapi.ListDeploymentEventsResponse:
      properties:
        events:
          items:
            $ref: '#/components/schemas/httpapi.DeploymentEventResponse'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        next_after:
          type: integer
      type: object
    httpapi.LiveComponentHealthResponse:
      properties:
        failure_message:
          type: string
        failure_reason:
          type: string
        name:
          type: string
        ready:
          type: boolean
        ready_replicas:
          type: integer
      type: object
    httpapi.PatchAppRequest:
      properties:
        branch:
          type: string
        memory_enabled:
          type: boolean
        name:
          type: string
        status:
          type: string
        subdirectory:
          type: string
        workspace_name:
          type: string
      type: object
    httpapi.PlatformVersionHistoryListResponse:
      properties:
        history:
          items:
            $ref: '#/components/schemas/platformversions.HistoryEntry'
          type: array
          uniqueItems: false
        limit:
          type: integer
        next_cursor:
          type: string
      type: object
    httpapi.PlatformVersionListResponse:
      properties:
        versions:
          items:
            $ref: '#/components/schemas/platformversions.Version'
          type: array
          uniqueItems: false
      type: object
    httpapi.PlatformVersionUpdateRequest:
      properties:
        change_note:
          type: string
        images:
          $ref: '#/components/schemas/platformversions.ComponentImages'
      required:
      - images
      type: object
    httpapi.PutTenantSecretRequest:
      properties:
        description:
          type: string
        value:
          type: string
      required:
      - value
      type: object
    httpapi.RollbackRequest:
      properties:
        target_deployment_id:
          type: string
      required:
      - target_deployment_id
      type: object
    httpapi.RollbackResponse:
      properties:
        deployment_id:
          type: string
        status:
          type: string
      type: object
    httpapi.SecretsStatusResponse:
      properties:
        ready:
          type: boolean
        secrets:
          additionalProperties:
            type: boolean
          type: object
      type: object
    httpapi.StartBuildResponse:
      properties:
        build_id:
          type: string
        status:
          type: string
      type: object
    httpapi.TenantSecretResponse:
      properties:
        created_at:
          type: string
        description:
          type: string
        name:
          type: string
        updated_at:
          type: string
        version:
          type: integer
      type: object
    httpapi.TenantSecretsListResponse:
      properties:
        secrets:
          items:
            $ref: '#/components/schemas/httpapi.TenantSecretResponse'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    httpapi.TriggerBuildRequest:
      properties:
        branch:
          type: string
        commit_sha:
          type: string
        mode:
          description: |-
            Mode controls how triggering behaves when prior attempts exist for the same commit.
            - "rebuild": force a new attempt even if the latest attempt succeeded
            - omitted/other: normal behavior (skip if latest attempt succeeded)
          type: string
      type: object
    httpapi.TriggerBuildResponse:
      properties:
        app_id:
          type: string
        branch:
          type: string
        build_id:
          type: string
        commit_sha:
          type: string
        outcome:
          type: string
        reason:
          type: string
        trigger:
          type: string
      type: object
    httpapi.TriggerDeployRequest:
      properties:
        build_id:
          type: string
      type: object
    httpapi.TriggerDeployResponse:
      properties:
        deployment_id:
          type: string
        status:
          type: string
      type: object
    httpapi.ValidatePlatformVersionImagesRequest:
      properties:
        images:
          additionalProperties:
            type: string
          description: |-
            Images maps component names to their ECR image URIs.
            Accepted components: runner-base, fctr-exec, orchestration-engine, memory, fctr-fwdr, fctr-resolver.
          type: object
      required:
      - images
      type: object
    httpapi.WorkspaceComponentHealth:
      properties:
        message:
          type: string
        name:
          type: string
        ready_replicas:
          type: integer
        reason:
          type: string
        scope:
          type: string
        status:
          type: string
        type:
          type: string
      type: object
    httpapi.WorkspaceHealthResponse:
      properties:
        checked_at:
          type: string
        components:
          items:
            $ref: '#/components/schemas/httpapi.WorkspaceComponentHealth'
          type: array
          uniqueItems: false
        overall:
          type: string
        project_id:
          type: string
        workspace_id:
          type: string
      type: object
    platformversions.ComponentImage:
      properties:
        image:
          type: string
        version:
          type: string
      type: object
    platformversions.ComponentImages:
      properties:
        fctrExec:
          $ref: '#/components/schemas/platformversions.ComponentImage'
        fctrFwdr:
          $ref: '#/components/schemas/platformversions.ComponentImage'
        fctrResolver:
          $ref: '#/components/schemas/platformversions.ComponentImage'
        memory:
          $ref: '#/components/schemas/platformversions.ComponentImage'
        orchestrationEngine:
          $ref: '#/components/schemas/platformversions.ComponentImage'
        runnerBase:
          $ref: '#/components/schemas/platformversions.ComponentImage'
      type: object
    platformversions.HistoryEntry:
      properties:
        change_note:
          type: string
        environment:
          type: string
        id:
          type: string
        next:
          $ref: '#/components/schemas/platformversions.ComponentImages'
        previous:
          $ref: '#/components/schemas/platformversions.ComponentImages'
        updated_at:
          type: string
        updated_by:
          type: string
      type: object
    platformversions.Version:
      properties:
        created_at:
          type: string
        environment:
          type: string
        id:
          type: string
        images:
          $ref: '#/components/schemas/platformversions.ComponentImages'
        updated_at:
          type: string
        updated_by:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Bearer token
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: Manages AER/Tool Pod lifecycle, builds, deployments, and secrets for
    the MongoDB Agentic Platform.
  title: Executor Control Plane API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/admin/apps:
    get:
      description: Returns a paginated list of apps across all orgs/projects with
        optional free-text search and status filter.
      parameters:
      - description: 'Free-text search: OR-matches across app_id, org_id, and project_id'
        in: query
        name: q
        schema:
          type: string
      - description: Filter by app status (active, paused, error, disconnected)
        in: query
        name: status
        schema:
          type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.AdminAppListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: List apps across the platform (admin)
      tags:
      - Apps
  /api/v1/admin/apps/{app_id}:
    get:
      description: Returns a single app without org/project scoping. App IDs are unique
        within an org but may collide cross-tenant; this returns the most recently
        created match.
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.AppResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Get an app by ID across the platform (admin)
      tags:
      - Apps
  /api/v1/admin/deployments:
    get:
      description: Returns a paginated list of deployments across all orgs/projects
        with optional filters.
      parameters:
      - description: Filter by organization ID
        in: query
        name: org_id
        schema:
          type: string
      - description: Filter by project ID
        in: query
        name: project_id
        schema:
          type: string
      - description: Filter by application ID
        in: query
        name: app_id
        schema:
          type: string
      - description: 'Free-text search: OR-matches across app_id, org_id, and project_id'
        in: query
        name: q
        schema:
          type: string
      - description: Filter by deployment status (comma-separated for multiple)
        in: query
        name: status
        schema:
          type: string
      - description: Page size
        in: query
        name: limit
        schema:
          default: 50
          type: integer
      - description: Page offset
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.DeploymentListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: List deployments across the platform (admin)
      tags:
      - Deployments
  /api/v1/admin/deployments/{deployment_id}:
    get:
      description: Returns a single deployment without requiring org/project scoping.
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.DeploymentResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Get a deployment by ID across the platform (admin)
      tags:
      - Deployments
  /api/v1/admin/deployments/{deployment_id}/events:
    get:
      description: Returns a paginated event log for any deployment. No org/project
        scoping.
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          type: string
      - description: 'Cursor: return events with sequence > after'
        in: query
        name: after
        schema:
          type: integer
      - description: Page size (1-500)
        in: query
        name: limit
        schema:
          default: 100
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ListDeploymentEventsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: List deployment events (admin)
      tags:
      - Deployments
  /api/v1/admin/deployments/{deployment_id}/events/stream:
    get:
      description: SSE stream of real-time deployment events without org/project scoping.
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          type: string
      - description: Only return events with sequence > after_seq
        in: query
        name: after_seq
        schema:
          type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE event stream
        "400":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Bad Request
        "404":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Not Found
        "503":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/httpapi.ErrorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Stream deployment events (admin)
      tags:
      - Deployments
  /api/v1/admin/platform-versions:
    get:
      description: Returns the configured component image versions for every environment.
        The API Gateway proxies admin UI traffic here.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpapi.PlatformVersionListResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
