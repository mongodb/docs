extends: substitution
message: "Consider using '%s' instead of '%s'."
link: 'https://www.mongodb.com/docs/meta/style-guide/writing/write-clear-concise-sentences-paragraphs/'
ignorecase: true
level: suggestion
action:
  name: replace
# Omits swaps that contradict the Alphabetical List of Terms (for example,
# approximately -> about and incorrect -> wrong) and words that are standard
# technical vocabulary in MongoDB docs (aggregate, contains, monitor).
swap:
  abundance: plenty
  accelerate: speed up
  accentuate: stress
  accompany: go with
  accomplish: carry out|do
  accorded: given
  accordingly: so
  accrue: add
  acquiesce: agree
  acquire: get|buy
  addressees: you
  'adjacent\s+to': next to
  adjustment: change
  admissible: allowed
  advantageous: helpful
  advise: tell
  alleviate: ease
  ameliorate: improve
  amend: change
  anticipate: expect
  apparent: clear|plain
  ascertain: discover|find out
  assistance: help
  attain: meet
  belated: late
  bestow: give
  cease: stop|end
  collaborate: work together
  commence: begin
  compensate: pay
  concerning: about
  confer: give|award
  consequently: so
  consolidate: merge
  convene: meet
  depart: leave
  detrimental: bad|harmful
  disclose: share|tell
  discontinue: stop
  disseminate: send|give
  elucidate: explain
  enclosed: inside|included
  endeavor: try
  equitable: fair
  expedite: hurry
  facilitate: ease
  frequently: often
  itemized: listed
  jeopardize: risk
  liaise: work with|partner with
  methodology: method
  necessitate: cause
  obligate: bind|compel
  optimum: best|most
  possess: own
  prioritize: rank
  procure: buy
  solicit: request
  state-of-the-art: latest
  substantial: large
  sufficient: enough
