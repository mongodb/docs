# Security-scan manifest for the Cloud Manager docset. Conforms to
# references/SCHEMA.md.

docset: cloud-manager
# Verified against recent Cloud Manager DOCSP tickets (DOCSP-66045, DOCSP-66046).
component:
  - "Cloud Manager"

docs:
  path: content/cloud-manager
  # Everything except reference/api/* (U-7-exempt curl reference) and release-notes/*.
  surface_pages:
    - "tutorial/*"
    - "core/*"
    - "security/*"
    - "data-explorer/*"
    - "performance-advisor/*"
    - "schema-advisor/*"
    - "reference/alerts/*"
    - "reference/faq/*"
    - "reference/legal/*"
    - "reference/troubleshooting/*"
    - "reference/alert-types.txt"
    - "reference/alerts.txt"
    - "reference/api-error-codes.txt"
    - "reference/audit-events.txt"
    - "reference/cluster-configuration.txt"
    - "reference/cluster-configuration-process-options.txt"
    - "reference/deployment-advanced-options.txt"
    - "reference/firewall-configuration.txt"
    - "reference/glossary.txt"
    - "reference/health-score.txt"
    - "reference/mongodb-agent-external-configuration.txt"
    - "reference/mongodb-agent-settings.txt"
    - "reference/mongodb-compatibility.txt"
    - "reference/monitoring-metrics-per-plan.txt"
    - "reference/monitoring.txt"
    - "reference/required-access-mongodb-agent.txt"
    - "reference/required-permissions-aws-user.txt"
    - "reference/resilient-application.txt"
    - "reference/supported-browsers.txt"
