<svg width="620px" height="580px" viewBox="0 0 620 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Kubernetes Cluster outer container -->
  <rect x="30" y="20" width="560" height="545" rx="16" fill="none" stroke="#00684A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="50" y="10" width="190" height="24" rx="6" fill="#00684A"/>
  <text x="145" y="22" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Kubernetes Cluster</text>

  <!-- Operator-Managed Replica Set container -->
  <rect x="55" y="44" width="510" height="150" rx="12" fill="#E3F5ED" stroke="#00684A" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="310" y="66" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#00684A">Operator-Managed MongoDB Replica Set</text>

  <!-- rs nodes: centers at 175, 310, 445 -->
  <!-- rs-0 -->
  <rect x="120" y="84" width="110" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="175" y="103" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">rs-0</text>
  <text x="175" y="122" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">Primary</text>

  <!-- rs-1 -->
  <rect x="255" y="84" width="110" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="310" y="103" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">rs-1</text>
  <text x="310" y="122" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">Secondary</text>

  <!-- rs-2 -->
  <rect x="390" y="84" width="110" height="56" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="445" y="103" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">rs-2</text>
  <text x="445" y="122" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3D4F58">Secondary</text>

  <!-- mongod managed label -->
  <text x="310" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">(mongod instances managed by the operator)</text>

  <!-- TLS funnel: rs-0, rs-1, rs-2 converge to x=310, then arrow down to Service -->
  <line x1="175" y1="140" x2="310" y2="212" stroke="#00684A" stroke-width="1" fill="none"/>
  <line x1="310" y1="140" x2="310" y2="212" stroke="#00684A" stroke-width="1" fill="none"/>
  <line x1="445" y1="140" x2="310" y2="212" stroke="#00684A" stroke-width="1" fill="none"/>

  <!-- K8s Service (proxy-svc) box on the mongod -> Envoy path -->
  <rect x="200" y="212" width="220" height="52" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="310" y="231" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#001E2B">K8s Service (ClusterIP)</text>
  <text x="310" y="249" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#3D4F58">&lt;name&gt;-search-0-proxy-svc</text>
  <text x="432" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">TLS</text>

  <!-- Arrow Service -> Envoy -->
  <line x1="310" y1="264" x2="310" y2="299" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Envoy Proxy box (centered at 310) -->
  <rect x="120" y="300" width="380" height="115" rx="10" fill="#001E2B" stroke="#00ED64" stroke-width="1.5"/>
  <text x="310" y="324" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00ED64">Envoy Proxy</text>
  <text x="310" y="341" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9BCFC3">(operator-managed)</text>
  <circle cx="144" cy="362" r="3" fill="#00ED64"/>
  <text x="156" y="366" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">Listens on port 27028</text>
  <circle cx="144" cy="382" r="3" fill="#00ED64"/>
  <text x="156" y="386" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0DED9">mTLS to mongot backend</text>

  <!-- Arrow from Envoy bottom to mongot -->
  <line x1="310" y1="415" x2="310" y2="472" stroke="#00684A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- mongot StatefulSet (single, for the replica set) -->
  <rect x="210" y="473" width="200" height="64" rx="8" fill="#ffffff" stroke="#00684A" stroke-width="1.5"/>
  <text x="310" y="496" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="700" fill="#001E2B">&lt;name&gt;-search</text>
  <text x="310" y="516" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3D4F58">mongot StatefulSet</text>

  <!-- MongoDB leaf logo mark -->
  <g transform="translate(548, 32)">
    <path d="M10 0 C10 0, 18 8, 18 16 C18 24, 10 28, 10 28 C10 28, 2 24, 2 16 C2 8, 10 0, 10 0Z" fill="#00ED64"/>
    <line x1="10" y1="14" x2="10" y2="30" stroke="#00684A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
