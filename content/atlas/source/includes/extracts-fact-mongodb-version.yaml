ref: fact-mongodb-version
content: |

   For Free and Flex clusters, |service| manages the MongoDB version for your
   cluster. You can't select or change the MongoDB version manually. |service|
   automatically upgrades your cluster to the latest MongoDB version after
   several patch releases become available.

   For ``M10+`` clusters, you can either select a specific supported MongoDB
   version for your cluster to use, or use the
   :guilabel:`Latest Version With Auto Upgrades` option. To see
   the MongoDB versions that |service| supports, see the
   :ref:`MongoDB Server Release Notes <server-release-notes-landing>` .

   To select the MongoDB version for your cluster, use the
   dropdown in the :guilabel:`Additional Settings` section
   of the {+cluster+} form.
   
   To use the :manual:`latest </reference/versioning/>` 
   MongoDB version, select :guilabel:`Latest Version With Auto Upgrades`. You 
   can't select a specific minor release or patch release.
   
   .. include:: /includes/mongosync-minor-version-compatibility-restriction.rst

   Selecting this option also limits your ability to revert
   to a specific major version.

   .. include:: /includes/latest-release-reversion-restriction.rst

   As new patch releases become available, |service| upgrades to
   these releases via a rolling process to maintain cluster
   availability. During the upgrade to the next minor release version, 
   the {+cluster+} card in the |service| UI :guilabel:`Database 
   Deployments` page might show the |fcv-link| of your {+cluster+} 
   instead of the MongoDB version to reflect the features that are 
   currently available on your {+cluster+}.

   To learn more about how |service| handles end of life of major
   MongoDB versions, see :ref:`atlas-eol-upgrade`

---
ref: fact-mongodb-version-downgrade-restriction-scale
content: |

   |service| always upgrades the cluster to the latest patch release of
   the specified major version. The upgrade uses a rolling update
   process to maintain cluster availability.
   
   You can't downgrade the cluster to an earlier MongoDB version unless 
   you pinned the cluster's |fcv| before upgrading.

   You can switch from using the :guilabel:`Latest Release` to using a
   specific release only if the latest MongoDB version is a major
   release.

