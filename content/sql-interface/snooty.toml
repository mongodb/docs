[[composables]]
id = "deployment-type"
title = "Deployment Type"
default = "atlas"
options = [
   {id = "atlas", title = "Atlas (Cloud)"},
   {id = "local", title = "Atlas (Local)"},
   {id = "self", title = "Self-Managed (On-Premises)"},
   {id = "local-onprem", title = "Atlas (Local) or Self-Managed (On-Premises)"},
]

# Must stay declared AFTER deployment-type. A dependent dimension declared
# before its parent filters the parent's own dropdown.
[[composables]]
id = "atlas-deployment"
title = "Atlas Deployment"
default = "federated"
dependencies = [{deployment-type = "atlas"}]
options = [
   {id = "dedicated", title = "Dedicated Cluster"},
   {id = "federated", title = "Federated Database Instance"},
]

